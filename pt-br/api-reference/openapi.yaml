          title: Recordid
        description: Identificador único do registro de pipeline.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Uma chave que você escolhe para cada alteração, como o id
