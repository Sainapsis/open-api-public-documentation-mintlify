            menos um é obrigatório.
        handoffMessages:
          items:
            type: string
          type: array
          title: Handoff Messages
          description: Corpos de mensagens opcionais publicados como parte da transferência.
        includeAiLeadSummary:
          type: boolean
          title: Include AI Lead Summary
          description: Com true, a mensagem de transferência deve incluir um resumo do
            lead gerado por IA.
          default: false
      additionalProperties: false
      type: object
      required:
