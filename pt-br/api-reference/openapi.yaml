          additionalProperties:
            type: string
          type: object
          title: Headers
          description: >-
            Cabeçalhos obrigatórios para o PUT pré-assinado (por exemplo,
            Content-Type e x-amz-checksum-sha256).
          examples:
            - Content-Type: image/jpeg
              x-amz-checksum-sha256: OaZ+I0yqf3u3u5w8h0Y2v4e7W9vHh3zbn2mA2m1yPVo=
      type: object
      required:
        - url
      title: PresignPut
      description: Dados do PUT pré-assinado para enviar um arquivo de mídia.
    Problem:
      properties:
        title:
          type: string
          title: Title
          description: Resumo breve do tipo de problema.
        status:
          type: integer
          title: Status
          description: Código de status HTTP gerado pelo servidor de origem para esta
            ocorrência do problema.
        detail:
          anyOf:
            - type: string
            - type: "null"
          title: Detail
          description: Explicação específica desta ocorrência do problema.
        instance:
          anyOf:
            - type: string
            - type: "null"
          title: Instance
          description: Referência URI que identifica esta ocorrência do problema.
        traceId:
          anyOf:
            - type: string
            - type: "null"
          title: Traceid
          description: ID de rastreamento para depuração.
        code:
          anyOf:
            - type: string
            - type: "null"
          title: Code
          description: Código para identificar o erro; consulte a página de códigos de
            erro para mais detalhes.
        errors:
          anyOf:
            - items:
                additionalProperties: true
                type: object
              type: array
            - type: "null"
          title: Errors
          description: Lista de detalhes dos erros.
        extra:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Extra
          description: Informações adicionais sobre o problema.
      type: object
      required:
        - title
        - status
      title: Problem
      description: Objeto que representa o corpo de uma resposta Problem.
    ProviderChannel:
      properties:
        provider:
          $ref: "#/components/schemas/MessageProviderType"
          title: Provider
          description: Nome do provedor do canal de mensagens.
          examples:
            - WHATSAPP
            - HEYGIA
        identifier:
          type: string
          title: Identifier
          description: Identificador associado a este canal do provedor, em formato E.164
            sem o sinal '+'.
      type: object
      required:
        - provider
        - identifier
      title: ProviderChannel
      description: Canal de provedor associado a um workspace.
    ProviderChannelResponse:
      properties:
        workspaceId:
          type: string
          title: Workspace Identifier
          description: Identificador único do workspace (UUID v4).
          examples:
            - 92b2d4f3-81e1-4b61-a7ec-6f4ff3b58be5
        providerChannels:
          items:
            $ref: "#/components/schemas/ProviderChannel"
          type: array
          title: Provider Channels
          description: Lista de canais de provedores (números de telefone) disponíveis
            para este workspace.
      type: object
      required:
        - workspaceId
        - providerChannels
      title: ProviderChannelResponse
      description: Corpo da resposta para operações com canais de provedores.
    RecordContactResponse:
      properties:
        id:
          type: string
          title: Identifier
          description: Id do contato. Resolva-o com `GET /contacts/{contactId}`.
          examples:
          - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
      type: object
      required:
      - id
      title: RecordContactResponse
      description: O contato ao qual um registro pertence.
    RecordContactRequest:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Identifier
          description: Id do contato, conforme retornado pela API de Contatos.
          examples:
          - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
        phone:
          anyOf:
          - type: string
            maxLength: 320
            minLength: 1
          - type: 'null'
          title: Phone
          description: 'Celular do contato, interpretado como o `GET /contacts/lookup`
            o interpreta: um número sem código de país é interpretado no país padrão
            do workspace.'
          examples:
          - '+573001234567'
        email:
          anyOf:
          - type: string
            maxLength: 320
            minLength: 1
          - type: 'null'
          title: Email
          description: E-mail do contato, interpretado como o `GET /contacts/lookup`
            o interpreta.
          examples:
          - john.doe@example.com
      additionalProperties: false
      type: object
      title: RecordContactRequest
      description: O contato ao qual o registro pertence, informado por exatamente
        um de seus identificadores. O contato nunca é criado.
    RecordCloseReasonResponse:
      properties:
        id:
          type: string
          title: Identifier
          description: Id do motivo de fechamento, conforme `GET /pipelines/{pipelineId}`.
          examples:
          - reason-price
        label:
          type: string
          title: Label
          description: Nome do motivo de fechamento quando o registro foi fechado.
          examples:
          - Price too high
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: Texto livre escrito quando o registro foi fechado.
          examples:
          - null
      type: object
      required:
      - id
      - label
      title: RecordCloseReasonResponse
      description: O motivo com o qual um registro fechado foi fechado.
    ReleaseConversationBody:
      properties:
        reason:
          anyOf:
            - type: string
            - type: "null"
          title: Reason
          description: Motivo opcional para liberar a conversa.
          examples:
            - The conversation is over
            - null
      type: object
      title: ReleaseConversationBody
      description: Corpo do POST para liberar uma conversa. O motivo é opcional.
    ReopenPipelineRecordBody:
      properties:
        expectedRevision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Revision
          description: A `revision` do registro que você leu por último. Quando deixa
            de ser a atual, a alteração falha com 409 `BRIDGE_PIPELINE_0101` e o registro
            atual em `extra.currentRecord`. Sem ela, a alteração se aplica ao registro
            como a solicitação o lê, então outra alteração feita no mesmo instante
            ainda pode fazê-la falhar com esse 409.
          examples:
          - 3
      additionalProperties: false
      type: object
      title: ReopenPipelineRecordBody
      description: Corpo da solicitação para reabrir um registro de pipeline fechado.
    TemplateDiscoveryResponse:
      properties:
        id:
          type: string
          title: Id
          description: Identificador único do modelo.
          examples:
            - f0000040-0000-4000-8000-000000000040
        name:
          type: string
          title: Name
          description: Nome do modelo, usado para identificá-lo no envio.
          examples:
            - order_shipped_promo
        language:
          type: string
          title: Language
          description: "Idioma do pivot resolvido (idioma padrão do modelo), como código
            da Meta: es, en, pt_BR."
          examples:
            - es
            - pt_BR
        variables:
          items:
            $ref: "#/components/schemas/TemplateVariableResponse"
          type: array
          title: Variables
          description: Inventário agnóstico das variáveis deste modelo.
        driftWarning:
          $ref: "#/components/schemas/TemplateDriftWarningResponse"
          title: Drift warning
          description: Diferença entre declaração e snapshot, apenas para diagnóstico.
            Nunca bloqueia um envio.
      type: object
      required:
        - id
        - name
        - language
        - driftWarning
      title: TemplateDiscoveryResponse
      description: >-
        Inventário agnóstico das variáveis de um modelo para um cliente que deve
        enviá-lo sem conhecer o modelo da Meta.
      examples:
        - id: f0000040-0000-4000-8000-000000000040
          language: es
          name: order_shipped_promo
          driftWarning:
            hasDrift: false
            stale: []
            missingLabels: []
          variables:
            - callerMustSupply: false
              key: first_name
              label: Contact first name
            - callerMustSupply: false
              key: order_code
              label: Order code
            - callerMustSupply: false
              key: shipment_id
              label: Shipment ID
            - callerMustSupply: true
              key: promo_code
              label: Promo code
    TemplateDriftWarningResponse:
      properties:
        hasDrift:
          type: boolean
          title: Has drift
        stale:
          items:
            $ref: "#/components/schemas/TemplateVariableRef"
          type: array
          title: Stale
          description: Declarado, mas não mais exigido pelo snapshot.
        missingLabels:
          items:
            $ref: "#/components/schemas/TemplateVariableRef"
          type: array
          title: Missing labels
          description: Exigido pelo snapshot, mas ainda não declarado.
      type: object
      required:
        - hasDrift
      title: TemplateDriftWarningResponse
      description: >-
        Diferença, apenas para diagnóstico, entre as variáveis declaradas e o
        que o snapshot da Meta exige.


        Conforme a regra de autoridade, isso nunca afeta o sucesso de um envio:
        apenas o snapshot determina o resultado. Permite que o cliente ou o
        console identifique um modelo cujos rótulos precisam ser atualizados
        após uma edição feita diretamente no WhatsApp Manager.
    TemplateVariableRef:
      properties:
        key:
          type: string
          title: Key
          examples:
            - delivery_date
        label:
          type: string
          title: Label
          examples:
            - Delivery date
      type: object
      required:
        - key
        - label
      title: TemplateVariableRef
      description: Slot identificado apenas por sua chave e rótulo agnósticos, sem
        endereço de slot da Meta.
    TemplateVariableResponse:
      properties:
        key:
          type: string
          title: Key
          description: Identificador agnóstico desta variável, estável entre provedores.
          examples:
            - tracking_code
        label:
          type: string
          title: Label
          description: Rótulo legível desta variável.
          examples:
            - Tracking code
        callerMustSupply:
          type: boolean
          title: Caller must supply
          description: >-
            Indica se o cliente deve fornecer um valor para esta variável ao
            enviar o modelo: true quando o modelo não tem uma origem declarada
            para o valor (por exemplo, um código promocional conhecido apenas
            pelo cliente) e false quando o Bridge o resolve por conta própria
            (por exemplo, a partir do perfil do destinatário).
          examples:
            - true
            - false
        isCustom:
          type: boolean
          title: Is custom
          description: >-
            Indica se é uma variável personalizada: um valor conhecido apenas
            pelo cliente e que tem um texto padrão. O cliente pode enviá-lo em
            `parameters`; quando omitido ou enviado em branco, usa-se `default`.
          default: false
          examples:
            - true
            - false
        default:
          anyOf:
            - type: string
            - type: "null"
          title: Default
          description: "Para uma variável personalizada, o texto enviado quando quem chama não fornece um valor; nos demais casos, null."
          examples:
            - pending
            - null
      type: object
      required:
        - key
        - label
        - callerMustSupply
      title: TemplateVariableResponse
      description: >-
        Variável de modelo identificada por sua chave agnóstica; um endereço de
        slot da Meta nunca aparece aqui.
      examples:
        - callerMustSupply: false
          isCustom: false
          key: first_name
          label: Contact first name
        - callerMustSupply: false
          default: pending
          isCustom: true
          key: tracking_code
          label: Tracking code
        - callerMustSupply: true
          isCustom: false
          key: promo_code
          label: Promo code
    UpdateContactBody:
      properties:
        firstName:
          anyOf:
            - type: string
            - type: "null"
          title: First Name
          description: Nome do contato.
          examples:
            - John
            - null
        lastName:
          anyOf:
            - type: string
            - type: "null"
          title: Last Name
          description: Sobrenome do contato.
          examples:
            - Doe
            - null
        email:
          anyOf:
            - type: string
              format: email
            - type: "null"
          title: Email
          description: E-mail do contato.
          examples:
            - john.doe@example.com
            - null
        languageCode:
          anyOf:
            - $ref: "#/components/schemas/LanguageCode"
            - type: "null"
          title: Language Code
          description: Código de idioma do contato.
          examples:
            - EN
        cellphone:
          anyOf:
            - type: string
            - type: "null"
          title: Cellphone
          description: Número de celular do contato. Sem código de país, é interpretado
            conforme o país do workspace.
          examples:
            - "+14084029292"
            - null
        ownerIdentifier:
          anyOf:
            - $ref: "#/components/schemas/InternalUserIdentifierRequest"
            - type: "null"
          title: Owner Identifier
          description: Identificador do vendedor ou usuário proprietário do contato.
        customAttributes:
          $ref: "#/components/schemas/CustomAttributesBody"
          title: Custom Attributes
          description: Objeto com as listas openAttributes e closedAttributes.
      additionalProperties: false
      type: object
      title: UpdateContactBody
      description: Corpo da solicitação para atualizar um contato existente.
    UpdateConversation:
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
          description: Nome ou título opcional da conversa.
          examples:
            - Client Support
            - null
        status:
          anyOf:
            - $ref: "#/components/schemas/ConversationStatus"
            - type: "null"
          title: Status
          description: >-
            Status inicial da conversa: 'active' para conversas visíveis e
            'ghost' para conversas invisíveis até a primeira interação.
          examples:
            - ACTIVE
        participants:
          anyOf:
            - $ref: "#/components/schemas/ParticipantOperationsRequest"
            - type: "null"
          title: Participants
          description: Operações para adicionar e remover participantes de uma conversa.
      additionalProperties: false
      type: object
      title: UpdateConversation
      description: Corpo da solicitação para atualizar uma conversa existente.
    UpdatePipelineRecordBody:
      properties:
        expectedRevision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Revision
          description: A `revision` do registro que você leu por último. Quando deixa
            de ser a atual, a alteração falha com 409 `BRIDGE_PIPELINE_0101` e o registro
            atual em `extra.currentRecord`. Sem ela, a alteração se aplica ao registro
            como a solicitação o lê, então outra alteração feita no mesmo instante
            ainda pode fazê-la falhar com esse 409.
          examples:
          - 3
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: 'Novo nome do registro, de até 200 caracteres. Omita-o para
            manter o atual. Um registro sempre tem nome: `null` ou um texto em branco
            falha com 422 `BRIDGE_PIPELINE_0311` (`errRecordName`).'
          examples:
          - Acme renewal 2027 - expanded
        values:
          additionalProperties: true
          type: object
          title: Values
          description: Valores a alterar, indexados por id de atributo; os atributos
            omitidos mantêm seu valor. Um `null`, um texto em branco ou uma lista
            vazia remove o valor. Só são aceitos atributos de escopo `RECORD` da versão
            que o registro segue, cada um verificado conforme seu tipo.
          examples:
          - budget: 18000000
      additionalProperties: false
      type: object
      title: UpdatePipelineRecordBody
      description: Corpo da solicitação para alterar o nome ou alguns valores de um
        registro de pipeline.
    UserStatusFilter:
      type: string
      enum:
        - active
        - disabled
        - all
      title: UserStatusFilter
    UserType:
      type: string
      enum:
        - INTERNAL
        - EXTERNAL
        - BOT
      title: UserType
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
  securitySchemes:
    x-api-key:
      type: apiKey
      description: Copy the API key as provided by the Bridge Console.
      in: header
      name: x-api-key
