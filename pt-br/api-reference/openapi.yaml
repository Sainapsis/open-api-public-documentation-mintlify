components:
  schemas:
    AgentConfigStatus:
      type: string
      enum:
        - DRAFT
        - COMPLETE
      title: AgentConfigStatus
    AgentLine:
      properties:
        providerChannelId:
          type: string
          title: Provider Channel Identifier
          description: Identificador da linha (o mesmo valor recebido por
            `providerChannelId` nas operações de saída).
      type: object
      required:
        - providerChannelId
      title: AgentLine
      description: Linha de WhatsApp na qual um Agent responde.
    AgentOutboundContactRef:
      properties:
        identifier:
          type: string
          title: Identifier
          description: >-
            Identificador do Contact conforme identifierType: ID do Contact para
            ID, e-mail para EMAIL ou telefone em formato E.164 para PHONE. O
            Contact já deve existir no workspace.
          examples:
            - "+573001234567"
        identifierType:
          $ref: "#/components/schemas/ParticipantIdentifierType"
          title: Identifier Type
          description: Tipo de identificador.
          examples:
            - PHONE
            - EMAIL
            - ID
        messageProviderType:
          $ref: "#/components/schemas/MessageProviderType"
          title: Message Provider Type
          description: Provedor usado para entregar o modelo.
          examples:
            - WHATSAPP
        providerChannelId:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Channel Identifier
          description: >-
            Opcional. Linha preferida do Agent (o `providerChannelId` de uma de
            suas `lines` em `GET /agents`). Se omitida, qualquer uma de suas
            linhas pode ser usada. Se informada, deve ser uma linha ativa do
            Agent; caso contrário, a solicitação falha com 422. É uma
            preferência, não uma garantia: se a linha não estiver livre nem for
            recuperável, a mesma ordem se aplica a todas as linhas do Agent (com
            `forceSend=true`, primeiro uma ocupada controlada por este Agent e
            depois a indicada). A resposta não identifica a linha utilizada.
          examples:
            - c4f2a1e0-9b8d-4e7c-a6f5-1d2e3f4a5b6c
            - null
      type: object
      required:
        - identifier
        - identifierType
        - messageProviderType
      title: AgentOutboundContactRef
      description: Identifica o Contact ao qual a conversa de saída será direcionada.
    AgentOutboundContext:
      properties:
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Notes
          description: Notas em texto livre para o Agent, limitadas a 2000 caracteres.
          examples:
            - The Contact asked about pricing tiers last week.
            - null
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: >-
            Identificadores opcionais de arquivos pré-carregados armazenados na
            conversa como contexto para o Agent.
          examples:
            - []
            - - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
      type: object
      title: AgentOutboundContext
      description: Notas e mídias armazenadas na conversa como contexto para o Agent e
        os Bridge Users.
    AgentOutboundFollowUp:
      properties:
        messageBody:
          type: string
          title: Message Body
          description: Corpo em texto simples da mensagem de acompanhamento.
          examples:
            - Just confirming we're still on for tomorrow at 10am.
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: >-
            Aceito, mas ainda não utilizado: os acompanhamentos são armazenados
            apenas como texto e os anexos não são enviados.
          examples:
            - []
            - - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
      type: object
      required:
        - messageBody
      title: AgentOutboundFollowUp
      description: Acompanhamento de texto armazenado na conversa logo após o modelo
        inicial.
    AgentOutboundHandoffOverride:
      properties:
        preAssignedUser:
          $ref: "#/components/schemas/AgentOutboundPreAssignedUser"
          title: Pre-assigned User
          description: >-
            Bridge User a ser atribuído como consultor quando o Agent transferir
            a conversa. Validado durante a solicitação: ela é rejeitada se o
            usuário não existir, pertencer a outro workspace ou tiver sido
            excluído.
          examples:
            - identifier: advisor@acme.com
              identifierType: EMAIL
      additionalProperties: false
      type: object
      required:
        - preAssignedUser
      title: AgentOutboundHandoffOverride
      description: Pré-atribui o Bridge User que recebe a transferência da conversa de
        saída.
    AgentOutboundPreAssignedUser:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Valor que identifica o Bridge User, interpretado conforme
            identifierType.
          examples:
            - advisor@acme.com
            - usr_01HZ2K3J4M5N6P7Q8R9S0T1UV2
        identifierType:
          $ref: "#/components/schemas/InternalParticipantIdentifierType"
          title: Identifier Type
          description: Como resolver o identificador. ID busca pelo ID do Bridge User;
            EMAIL busca pelo e-mail.
          examples:
            - EMAIL
            - ID
      additionalProperties: false
      type: object
      required:
        - identifier
        - identifierType
      title: AgentOutboundPreAssignedUser
      description: Identifica o Bridge User que deve receber a transferência.
    AgentOutboundRequest:
      properties:
        contact:
          $ref: "#/components/schemas/AgentOutboundContactRef"
          title: Contact
          description: Contact ao qual esta conversa de saída é direcionada. Já deve
            existir no workspace.
        template:
          $ref: "#/components/schemas/LeadscoutOutboundTemplateRef"
          title: Template
          description: Modelo inicial a ser enviado.
        additionalMessages:
          items:
            $ref: "#/components/schemas/AgentOutboundFollowUp"
          type: array
          maxItems: 5
          title: Additional Messages
          description: >-
            Até cinco acompanhamentos de texto armazenados na conversa após o
            modelo inicial, na ordem informada, e enviados como o modelo. Os
            anexos (`mediaIds`) ainda não são enviados.
        agentContext:
          anyOf:
            - $ref: "#/components/schemas/AgentOutboundContext"
            - type: "null"
          title: Agent Context
          description: Notas e mídias opcionais armazenadas na conversa como contexto para
            o Agent.
        consent:
          anyOf:
            - $ref: "#/components/schemas/OutboundConsentRequest"
            - type: "null"
          title: Consent
          description: Evidência opcional de consentimento, declarada pela empresa,
            registrada na conversa.
        handoffOverride:
          anyOf:
            - $ref: "#/components/schemas/AgentOutboundHandoffOverride"
            - type: "null"
          title: Handoff Override
          description: >-
            Opcional. Pré-atribui um Bridge User específico como consultor para
            a transferência. O Bridge User é validado antes de qualquer
            gravação: a solicitação é rejeitada se o usuário não existir,
            pertencer a outro workspace ou tiver sido excluído.
        brandId:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Identifier
          description: >-
            ID opcional da marca. Quando informado, apenas as linhas do Agent
            vinculadas à marca são elegíveis; se não houver nenhuma, a
            solicitação falha com 404. Omita para considerar todas as linhas do
            Agent.
          examples:
            - null
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
        campaignId:
          anyOf:
            - type: string
            - type: "null"
          title: Campaign Identifier
          description: Referência opcional de campanha armazenada na conversa para
            auditoria e relatórios.
          examples:
            - null
            - spring_promo_2026
        forceSend:
          type: boolean
          title: Force Send
          description: >-
            Controla o que acontece quando nenhuma linha do Agent está livre ou
            é recuperável. Uma linha livre sempre tem prioridade, seguida de uma
            linha com uma conversa liberada recuperável com este Contact,
            qualquer que seja o valor desta opção. Quando nenhuma existe: com
            false (padrão), a solicitação falha com 409
            `BRIDGE_AI_LEADSCOUT_0008`; com true, uma linha ocupada por uma
            conversa ativa com este Contact é reutilizada, dando preferência a
            uma controlada por este Agent. Se a conversa escolhida for
            controlada por outro Agent ou por um Bridge User, a solicitação
            falha com 409 `BRIDGE_AI_AGENT_OUTBOUND_0006` e nada é gravado;
            libere-a primeiro e tente novamente. Linhas cuja conversa está
            bloqueada ou foi liberada sem recuperação nunca são usadas;
            portanto, se nenhuma linha estiver ocupada por uma conversa ativa, a
            solicitação falha com 409 `BRIDGE_AI_LEADSCOUT_0008` mesmo com true.
          default: false
          examples:
            - false
            - true
      type: object
      required:
        - contact
        - template
      title: AgentOutboundRequest
      description: Corpo da solicitação para iniciar uma conversa de saída atendida
        por um Agent específico.
    AgentOutboundResponse:
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationResponse"
          title: Conversation
          description: >-
            Conversa agora controlada pelo Agent: nova, reutilizada
            (`alreadyInitiated`) ou recuperada (`recovered`).
        contact:
          $ref: "#/components/schemas/ContactResponse"
          title: Contact
          description: Contato com o qual a conversa foi iniciada.
        templateSent:
          anyOf:
            - $ref: "#/components/schemas/AgentTemplateSent"
            - type: "null"
          title: Template Sent
          description: Resumo do modelo armazenado para abrir a conversa.
        additionalMessagesPersisted:
          type: integer
          title: Additional Messages Persisted
          description: Número de mensagens de acompanhamento armazenadas na conversa.
          default: 0
          examples:
            - 0
            - 3
        alreadyInitiated:
          type: boolean
          title: Already Initiated
          description: >-
            True quando esta solicitação bem-sucedida reutilizou uma conversa
            ativa existente por forceSend=true. False para criação ou
            recuperação; consulte recovered para distinguir esses caminhos. É
            informativo: uma reutilização bem-sucedida também armazena o novo
            modelo e os acompanhamentos, portanto repetir a solicitação pode
            adicionar mensagens.
          default: false
          examples:
            - false
            - true
        recovered:
          type: boolean
          title: Recovered
          description: >-
            True quando uma conversa liberada que o Contact tinha na linha foi
            recuperada em vez de criar outra. A recuperação substitui o contexto
            de saída anterior e `agentContext`. Linhas recuperáveis são usadas
            mesmo com `forceSend=false`.
          default: false
          examples:
            - false
            - true
      type: object
      required:
        - conversation
        - contact
      title: AgentOutboundResponse
      description: Corpo da resposta de uma iniciação de saída bem-sucedida do Agent.
    AgentResponse:
      properties:
        id:
          type: string
          title: Agent Identifier
          description: Identificador único do Agent.
        name:
          type: string
          title: Name
          description: Nome do Agent.
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: Descrição do Agent. Sempre presente; null quando não há descrição.
        type:
          $ref: "#/components/schemas/AgentType"
          title: Type
          description: Tipo de Agent.
          examples:
            - LEADSCOUT
            - SERVICE_AGENT
        brandId:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Identifier
          description: Marca à qual o Agent pertence. Sempre presente; null quando não
            está limitado a uma marca.
        status:
          $ref: "#/components/schemas/AgentConfigStatus"
          title: Status
          description: Status de configuração do Agent.
          examples:
            - DRAFT
            - COMPLETE
        available:
          type: boolean
          title: Available
          description: "Indica se o Agent pode iniciar conversas: sua configuração está
            completa e ele tem uma linha."
        unavailableReason:
          anyOf:
            - type: string
            - type: "null"
          title: Unavailable Reason
          description: >-
            Motivo pelo qual o Agent não está disponível: `DRAFT` (configuração
