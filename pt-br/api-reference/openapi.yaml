    CreateConversationRequest:
      properties:
        participants:
          $ref: "#/components/schemas/CreateParticipantsOnConversationRequest"
          title: Participants
          description: Participantes a adicionar à conversa.
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
          description: Nome ou título opcional da conversa.
          examples:
            - Bridge Support Team
            - null
        status:
          $ref: "#/components/schemas/ConversationStatus"
          title: Status
          description: >-
            Status inicial da conversa: 'active' para conversas visíveis e
            'ghost' para conversas invisíveis até a primeira interação.
          default: ACTIVE
          examples:
            - ACTIVE
        teamId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Team Identifier
          description: >-
            UUID da equipe para distribuição em rodízio (opcional e mutuamente
            exclusivo com internalParticipants).
          examples:
            - 9fd1468d-e5ca-4ba3-98d1-13017e6f3808
        onboardingTemplates:
          items:
            $ref: "#/components/schemas/OnboardingTemplateRequest"
          type: array
          title: Onboarding Templates
          description: >-
            Templates ordenados para abrir a conversa. Eles substituem a
            sequência de abertura configurada no workspace para esta conversa,
            por inteiro ou apenas seu primeiro template, conforme a configuração
            do workspace; no segundo caso, o restante da sequência configurada
            ainda é enviado depois dos seus. A posição determina a ordem. Omita
            para manter o padrão do workspace. Cada template deve existir,
            pertencer ao seu workspace ou ao escopo da plataforma e, para
            templates de provedor do WhatsApp, estar aprovado pela Meta para a
            WhatsApp Business Account da linha pela qual cada participante é
            contatado; caso contrário, a solicitação é rejeitada e nenhuma
            conversa é criada. Um template cujas variáveis precisem de valores
            que só você pode fornecer os recebe em `parameters` da entrada. Se
            um dos templates configurados enviados depois dos seus precisar de
            valores que só quem chama pode fornecer, a solicitação é rejeitada
            com 422 `BRIDGE_CONVERSATION_0608`, com `extra.templateId`
            identificando esse template e `extra.origin` definido como
            `WORKSPACE_CONFIGURATION`. Alterar a solicitação não ajudará: peça a
            um administrador do workspace que altere a sequência de abertura.
      additionalProperties: false
      type: object
      required:
        - participants
      title: CreateConversationRequest
      description: Corpo da solicitação para criar uma conversa.
