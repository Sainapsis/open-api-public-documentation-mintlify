            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Stage Identifier
          description: Etapa em que o registro começa. Por padrão, a etapa inicial
            do pipeline; uma etapa final é recusada. Os requisitos da etapa se aplicam,
            como um contato completo.
          examples:
          - stage-new
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Nome do registro, de até 200 caracteres. Se ausente ou em branco,
            usa-se o nome completo do contato, depois seu celular e depois seu e-mail.
          examples:
          - Acme renewal 2027
        externalId:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: External Identifier
          description: Id do registro no seu sistema, único por pipeline. Um segundo
            registro com o mesmo `externalId` no mesmo pipeline é recusado com 409
            e o id do registro existente.
          examples:
          - ERP-OPP-981
        values:
