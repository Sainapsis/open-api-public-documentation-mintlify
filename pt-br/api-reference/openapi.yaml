        firstName:
          anyOf:
            - type: string
            - type: "null"
          title: First Name
          description: Nome do usuário interno.
          examples:
            - John
            - null
        lastName:
          anyOf:
            - type: string
            - type: "null"
          title: Last Name
          description: Sobrenome do usuário interno.
          examples:
            - Doe
            - null
        email:
          anyOf:
            - type: string
            - type: "null"
          title: Email
          description: E-mail do usuário interno.
          examples:
