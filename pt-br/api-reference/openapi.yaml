            - null
        cellphone:
          anyOf:
            - type: string
            - type: "null"
          title: Cellphone
          description: Número de celular do usuário interno.
          examples:
            - "+14084029292"
            - null
        languageCode:
          anyOf:
            - $ref: "#/components/schemas/LanguageCode"
            - type: "null"
          title: Language Code
