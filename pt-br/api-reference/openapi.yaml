        \ que `limit`, ou nenhum, enquanto ainda há um `cursor`: continue lendo até\
        \ que `cursor` seja null.\n- Apenas `pipelineId`: os registros desse pipeline,\
        \ opcionalmente restritos a um `stageId`.\n\nQualquer outra combinação falha\
        \ com 422."
