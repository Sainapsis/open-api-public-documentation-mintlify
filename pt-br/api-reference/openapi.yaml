  /bridge/api/v1/workspaces/{workspaceId}/files:
    post:
      tags:
        - Files API
      summary: Criar uploads pré-assinados de arquivos
      description: >-
        Carregue um anexo, como um PDF, uma imagem ou um documento, antes de
        criar uma mensagem. Esta operação retorna os dados de um PUT
        pré-assinado; os bytes do arquivo são enviados separadamente. Após o
        upload ser concluído, use o `mediaId` retornado na operação de envio.
        Siga [Enviar um anexo](/pt-br/guides/send-attachments) para as etapas de
        checksum, upload e mensagem.


        Gera URLs pré-assinadas para upload de arquivos (Presigned PUT). Valida
        a extensão, contentType e os limites por tipo. O checksum é obrigatório:
        envie o resumo SHA-256 em checksumBase64 (Base64). O upload deve incluir
        o cabeçalho x-amz-checksum-sha256 com o mesmo valor.


        ---

        Para fazer upload dos arquivos, você DEVE usar a URL pré-assinada
        retornada com o método HTTP PUT. Envie o arquivo exatamente para a URL
        indicada, sem modificações, conforme exigido pelo AWS S3 para PUT com
        URL pré-assinada. Consulte a documentação oficial do AWS S3:
        [Documentação do AWS S3 sobre Presigned
        PUT](https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html).

        Inclua todos os cabeçalhos obrigatórios indicados na resposta, por
        exemplo, 'x-amz-checksum-sha256' com o valor SHA-256 correto. A AWS
        rejeitará o upload se você não usar o método HTTP ou os cabeçalhos
        corretos.


