    LeadscoutOutboundContactRef:
      properties:
        identifier:
          type: string
          title: Identifier
          description: >-
            Identificador do Contact conforme identifierType: ID do Contact para
            ID, e-mail para EMAIL ou telefone em formato E.164 para PHONE. O
            Contact já deve existir no workspace.
          examples:
            - "+573001234567"
        identifierType:
          $ref: "#/components/schemas/ParticipantIdentifierType"
          title: Identifier Type
          description: Tipo de identificador.
          examples:
            - PHONE
            - EMAIL
            - ID
        messageProviderType:
          $ref: "#/components/schemas/MessageProviderType"
          title: Message Provider Type
          description: Provedor usado para entregar o modelo.
          examples:
            - WHATSAPP
        providerChannelId:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Channel Identifier
          description: >-
            ID opcional de linha explícita de WhatsApp. Quando informado, essa
            linha é usada, deve pertencer ao workspace e resolver para um Agent
            de prospecção. Se omitido, as linhas elegíveis são selecionadas
            automaticamente: primeiro livres, depois liberadas recuperáveis e,
            apenas com forceSend=true, ocupadas. Quando informado, brandId
            limita os candidatos à marca. O ID da linha não é um número de
            telefone. Consulte [identificadores](/pt-br/guides/identifiers) e
            [seleção de saída](/pt-br/guides/agent-outbound).
          examples:
            - c4f2a1e0-9b8d-4e7c-a6f5-1d2e3f4a5b6c
            - null
      type: object
      required:
        - identifier
        - identifierType
        - messageProviderType
      title: LeadscoutOutboundContactRef
      description: Identifica o lead ao qual a conversa de saída será direcionada.
    LeadscoutOutboundHandoffOverride:
      properties:
        preAssignedUser:
          $ref: "#/components/schemas/LeadscoutOutboundPreAssignedUser"
          title: Pre-assigned User
          description: >-
            Usuário interno a ser atribuído como consultor quando a IA
            transferir a conversa. Validado durante a solicitação: se o usuário
            não existir, estiver inativo ou pertencer a outro workspace, a
            solicitação será rejeitada antes de criar uma conversa.
          examples:
            - identifier: advisor@acme.com
              identifierType: EMAIL
      additionalProperties: false
      type: object
      required:
        - preAssignedUser
      title: LeadscoutOutboundHandoffOverride
      description: Substitui a atribuição padrão do consultor da conversa de saída.
    LeadscoutOutboundPreAssignedUser:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Valor que identifica o usuário interno, interpretado conforme
            identifier_type.
          examples:
            - advisor@acme.com
            - usr_01HZ2K3J4M5N6P7Q8R9S0T1UV2
        identifierType:
          $ref: "#/components/schemas/InternalParticipantIdentifierType"
          title: Identifier Type
          description: Como resolver o identificador. ID busca pelo ID do usuário interno;
            EMAIL busca pelo e-mail.
          examples:
            - EMAIL
            - ID
      additionalProperties: false
      type: object
      required:
        - identifier
        - identifierType
      title: LeadscoutOutboundPreAssignedUser
      description: Identifica o usuário interno que deve receber a transferência.
    LeadscoutOutboundRequest:
      properties:
        contact:
          $ref: "#/components/schemas/LeadscoutOutboundContactRef"
          title: Contact
          description: Lead ao qual esta conversa de saída é direcionada. Já deve existir
            no workspace.
        template:
          $ref: "#/components/schemas/LeadscoutOutboundTemplateRef"
          title: Template
          description: Modelo inicial a ser enviado.
        additionalMessages:
          items:
            $ref: "#/components/schemas/OutboundFollowUpRequest"
          type: array
          maxItems: 5
          title: Additional Messages
          description: >-
            Até cinco mensagens de acompanhamento armazenadas na conversa na
            ordem da solicitação. A persistência não confirma a entrega. Não
            presuma que essas mensagens aguardam a resposta do lead; consulte o
            guia de saída para considerações sobre entrega e novas tentativas.
        agentContext:
          anyOf:
            - $ref: "#/components/schemas/OutboundAgentContextRequest"
            - type: "null"
          title: Agent Context
          description: Notas e mídias opcionais armazenadas na conversa como contexto para
            o agente.
        consent:
          anyOf:
            - $ref: "#/components/schemas/OutboundConsentRequest"
            - type: "null"
          title: Consent
          description: Evidência opcional de consentimento, declarada pela empresa,
            registrada na conversa.
        handoffOverride:
          anyOf:
            - $ref: "#/components/schemas/LeadscoutOutboundHandoffOverride"
            - type: "null"
          title: Handoff Override
          description: >-
            Opção para pré-atribuir um usuário interno específico como consultor
            da transferência. Validada durante a solicitação; em caso de falha,
            a criação da conversa é cancelada.
        brandId:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Identifier
          description: >-
            ID opcional da marca. Quando informado, apenas os canais vinculados
            a ela são elegíveis. Omita para considerar todos os canais do
            workspace.
          examples:
            - null
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
        campaignId:
          anyOf:
            - type: string
            - type: "null"
          title: Campaign Identifier
          description: Referência opcional de campanha armazenada na conversa para
            auditoria e relatórios.
          examples:
            - null
            - spring_promo_2026
        forceSend:
          type: boolean
          title: Force Send
          description: >-
            Controla a reutilização de uma conversa ativa existente com este
            Contact na linha escolhida. Com false (padrão), uma linha ocupada
            selecionada explicitamente retorna 409 BRIDGE_AI_LEADSCOUT_0007; a
            seleção automática com apenas linhas ocupadas retorna 409
            BRIDGE_AI_LEADSCOUT_0008. Com true, uma conversa ocupada elegível é
            reutilizada em vez de criar uma nova, e uma reutilização
            bem-sucedida define alreadyInitiated=true. A seleção automática
            prefere uma linha livre, depois uma conversa liberada recuperável e,
            por último, uma conversa ocupada quando true. A recuperação é
            possível com qualquer um dos valores e retorna recovered=true. A
            rota legada do LeadScout pode reutilizar uma conversa controlada por
            um humano; ela não aplica a verificação de controle da saída de
            Agents. Esta opção não ignora conversas bloqueadas/não recuperáveis,
            verificações de sessão ou outras validações e não é uma chave de
            idempotência. Consulte [Saída de Agents e
            forceSend](/pt-br/guides/agent-outbound).
          default: false
          examples:
            - false
            - true
      type: object
      required:
        - contact
        - template
      title: LeadscoutOutboundRequest
      description: Corpo da solicitação para iniciar uma conversa de saída do LeadScout.
    LeadscoutOutboundResponse:
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationResponse"
          title: Conversation
          description: >-
            Conversa usada para esta solicitação de saída: nova, reutilizada
            (alreadyInitiated=true) ou recuperada (recovered=true). Uma conversa
            reutilizada mantém seu ID; a reutilização legacy, por si só, não
            implica mudança de controlador.
        contact:
          $ref: "#/components/schemas/ContactResponse"
          title: Contact
          description: Contato com o qual a conversa foi iniciada.
        templateSent:
          anyOf:
            - $ref: "#/components/schemas/LeadscoutTemplateSent"
            - type: "null"
          title: Template Sent
          description: Resumo do modelo despachado.
        additionalMessagesPersisted:
          type: integer
          title: Additional Messages Persisted
          description: Número de mensagens de acompanhamento armazenadas na conversa.
          default: 0
          examples:
            - 0
            - 3
        alreadyInitiated:
          type: boolean
          title: Already Initiated
          description: >-
            True quando esta solicitação bem-sucedida reutilizou uma conversa
            ativa existente por forceSend=true. False para criação ou
            recuperação; consulte recovered para distinguir esses caminhos. É
            informativo: uma reutilização bem-sucedida também armazena o novo
            modelo e os acompanhamentos, portanto repetir a solicitação pode
            adicionar mensagens.
          default: false
          examples:
            - false
            - true
        recovered:
          type: boolean
          title: Recovered
          description: >-
            True quando esta solicitação recuperou uma conversa liberada que o
            contato tinha no canal escolhido, em vez de criar outra.
          default: false
          examples:
            - false
            - true
      type: object
      required:
        - conversation
        - contact
      title: LeadscoutOutboundResponse
      description: Corpo da resposta de uma iniciação de saída bem-sucedida do LeadScout.
    LeadscoutOutboundTemplateRef:
      properties:
        id:
          anyOf:
            - type: string
            - type: "null"
          title: Template Identifier
          description: ID do modelo registrado (de GET /templates). Se id e name forem
            enviados, usa-se id.
          examples:
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
            - null
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Template Name
          description: >-
            Nome do modelo registrado e aprovado pela Meta a ser enviado.
            Obrigatório quando id não é enviado; ignorado quando id é enviado.
          examples:
            - leadscout_outbound_fb_v1
            - null
        orderedParams:
          items:
            type: string
          type: array
          title: Ordered Parameters
          description: >-
            Valores fornecidos pelo cliente para os slots de parâmetros do
            modelo com origem CALLER, em ordem de posição.
          examples:
            - - Maria
              - ACME
        parameters:
          additionalProperties:
            type: string
          type: object
          title: Parameters
          description: >-
            Valores fornecidos pelo cliente e indexados pela chave de variável
            do modelo (consulte GET /templates/{id} para obter as chaves), tanto
            para o corpo como para os botões. Prefira esta opção a orderedParams
            se o modelo tiver um botão dinâmico. Uma chave desconhecida ou que
            se sobreponha a um slot já coberto por orderedParams é rejeitada com
            422.
          examples:
            - recipient_first_name: Maria
              tracking_code: TRK123
        media:
          anyOf:
            - $ref: "#/components/schemas/OutboundTemplateMedia"
            - type: "null"
          title: Header Media
          description: >-
            Mídia opcional de cabeçalho (imagem, vídeo ou documento PDF) a
            anexar à mensagem do modelo. Aceita um mediaId pré-carregado ou uma
            url pública.
      type: object
      title: LeadscoutOutboundTemplateRef
      description: Referencia o modelo aprovado pela Meta que abrirá a conversa.
    LeadscoutTemplateSent:
      properties:
        id:
          anyOf:
            - type: string
            - type: "null"
          title: Template Identifier
          description: ID do modelo enviado.
          examples:
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
        name:
          type: string
          title: Template Name
          description: Nome do modelo despachado.
          examples:
            - leadscout_outbound_fb_v1
        messageId:
          anyOf:
            - type: string
            - type: "null"
          title: Message Identifier
          description: >-
            wamid da Meta do modelo despachado. É null no fluxo bem-sucedido até
            que o processo de envio retorne o wamid à API de entrada.
          examples:
            - null
            - wamid.HBgM...
      type: object
      required:
        - name
      title: LeadscoutTemplateSent
      description: Resumo do modelo despachado para abrir a conversa.
    MessageProviderType:
      type: string
      enum:
        - WHATSAPP
        - SMS
        - TELEGRAM
        - INSTAGRAM
        - TWITTER
        - LINE
        - FACEBOOK
        - IMESSAGE
        - WHATSAPP_TEST
        - HEYGIA
      title: MessageProviderType
    MessageRequest:
      properties:
        conversationId:
          type: string
          title: Conversation Identifier
          description: Identificador da conversa.
          examples:
            - d290f1ee-6c54-4b01-90e6-d701748f0851
        messageBody:
          type: string
          title: Message Body
          description: Corpo da mensagem.
          examples:
            - Hello, welcome to Bridge!
        replyToMessageId:
          anyOf:
            - type: string
            - type: "null"
          title: Reply To Message Identifier
          description: Identificador da mensagem à qual se está respondendo.
          examples:
            - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            - null
        enableExternalBroadcast:
          type: boolean
          title: Enable External Broadcast
          description: >-
            Controla se uma mensagem aceita é elegível para entrega externa. Com
            false, a mensagem é criada, mas o broadcast externo é ignorado. Com
            true, entra no fluxo normal de entrega externa quando as regras da
            conversa e do destinatário permitem. Uma resposta de criação
            bem-sucedida e messageId não são confirmações de entrega. Este
            indicador não concede visibilidade nem ignora permissões. Também não
            desativa os modelos de onboarding iniciados por uma solicitação
            separada de criação de conversa.
          examples:
            - true
            - false
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: Lista de IDs de mídia associados à mensagem.
          examples:
            - - a1b2c3d4-e5f6-7g8h-9i0j-k1l2m3n4o5p6
      type: object
      required:
        - conversationId
        - messageBody
        - enableExternalBroadcast
      title: MessageRequest
      description: Corpo da solicitação para criar uma mensagem em uma conversa específica.
    MessageResponse:
      properties:
        messagingProduct:
          type: string
          title: Messaging Product
          description: Nome do produto.
          default: bridge
          examples:
            - bridge
        messageId:
          type: string
          title: Message Identifier
          description: Identificador único da mensagem como string UUID.
          examples:
            - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
      type: object
      required:
        - messageId
      title: MessageResponse
      description: Corpo da resposta para operações com mensagens.
    MovePipelineRecordBody:
      properties:
        expectedRevision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Revision
          description: A `revision` do registro que você leu por último. Quando deixa
            de ser a atual, a alteração falha com 409 `BRIDGE_PIPELINE_0101` e o registro
            atual em `extra.currentRecord`. Sem ela, a alteração se aplica ao registro
            como a solicitação o lê, então outra alteração feita no mesmo instante
            ainda pode fazê-la falhar com esse 409.
          examples:
          - 3
        stageId:
          type: string
          maxLength: 255
          minLength: 1
          title: Stage Identifier
          description: Etapa para a qual o registro será movido, da versão do pipeline
            que o registro segue. Uma etapa final fecha o registro. Os requisitos
            da etapa se aplicam, como um contato completo.
          examples:
          - stage-won
        reasonId:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Close Reason Identifier
          description: Motivo de fechamento ativo do pipeline, conforme `GET /pipelines/{pipelineId}`.
            Apenas para uma movimentação para uma etapa final, e opcional nesse caso.
          examples:
          - reason-price
        reasonNote:
          anyOf:
          - type: string
          - type: 'null'
          title: Close Reason Note
          description: Texto livre que explica o motivo de fechamento, de até 500
            caracteres. Requer `reasonId`.
          examples:
          - Chose a cheaper provider
      additionalProperties: false
      type: object
      required:
      - stageId
      title: MovePipelineRecordBody
      description: Corpo da solicitação para mover um registro de pipeline para outra
        etapa do seu pipeline.
    OnboardingTemplateRequest:
      properties:
        templateId:
          type: string
          title: Template Identifier
          description: Identificador do modelo do sistema a ser enviado.
          examples:
            - 4061e74e-f6fe-4072-a760-3aec0b64f7a6
        parameters:
          additionalProperties:
            type: string
            maxLength: 1024
          propertyNames:
            maxLength: 128
          type: object
          maxProperties: 50
          title: Template Parameters
          description: >-
            Valores das variáveis deste template, indexados pela `key` da
            variável retornada por `GET /templates/{templateId}`. As variáveis
            marcadas com `callerMustSupply: true` são obrigatórias: a Bridge não
            tem outra fonte para elas. As demais são opcionais; um valor enviado
            para uma delas, como o primeiro nome do Contact, substitui o valor
            por Contact e é usado para todos os Contacts da conversa. Somente
            templates de provedor do WhatsApp aceitam parâmetros. Se um valor
            obrigatório estiver ausente ou em branco, uma chave não corresponder
            a nenhuma variável do template ou o template não aceitar parâmetros,
            a solicitação é rejeitada com 422 e nenhuma conversa é criada:
            `BRIDGE_CONVERSATION_0604` lista as variáveis ausentes em
            `extra.missingVariables` como `[{key, label}]`, `0605` lista as
            chaves desconhecidas em `extra.unknownKeys` e `0606` identifica o
            template em `extra.templateId`. Os valores também devem cumprir as
            regras do WhatsApp: sem quebras de linha ou tabulações, no máximo
            quatro espaços consecutivos, o cabeçalho com seu valor dentro de 60
            caracteres, o link de um botão de URL com seu valor dentro de 2.000
            e o texto do corpo mais seus valores dentro de 1.024. A Bridge
            recusa os valores que já consegue identificar como inválidos com
            `BRIDGE_CONVERSATION_0607`, identificando o template em
            `extra.templateId` e listando cada valor inválido em
            `extra.invalidVariables` como `[{key, label, reason}]`. `reason` é a
            primeira regra violada pelo valor: `NEWLINE`, `TAB`,
            `CONSECUTIVE_SPACES`, `TOO_LONG` (cabeçalho ou botão de URL) ou
            `BODY_TOO_LONG` (o corpo excede o limite, portanto todos os valores
            de corpo enviados são listados). Os valores preenchidos depois pela
            Bridge, como o primeiro nome do Contact, também contam para o limite
            do corpo; por isso, reserve espaço para eles. No máximo, 50
            parâmetros por template, com chaves de até 128 caracteres e cada
            valor de até 1.024.
          examples:
            - delivery_date: 3 de octubre
              order_number: A-10492
      additionalProperties: false
      type: object
      required:
        - templateId
      title: OnboardingTemplateRequest
      description: Entrada da substituição de onboarding; sua posição na lista
        determina a ordem.
    OpenAttributeRequest:
      properties:
        customAttributeId:
          type: string
          title: Custom Attribute Identifier
          description: Identificador único do atributo personalizado aberto.
          examples:
            - 651c97c1-b31d-466f-825c-fe77b39e7ae6
        content:
          type: string
          title: Content
          description: Valor do atributo aberto.
      type: object
      required:
        - customAttributeId
        - content
      title: OpenAttributeRequest
      description: Corpo da solicitação para operações de atributos personalizados abertos.
    OutboundAgentContextRequest:
      properties:
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Notes
          description: Notas em texto livre para o agente, limitadas a 2000 caracteres.
          examples:
            - Lead asked about pricing tiers last week.
            - null
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: >-
            Identificadores opcionais de arquivos pré-carregados armazenados na
            conversa como contexto do agente.
          examples:
            - []
            - - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
      type: object
      title: OutboundAgentContextRequest
      description: Notas e mídias armazenadas na conversa como contexto do agente para
        revisão por IA ou uma pessoa.
    OutboundConsentRequest:
      properties:
        status:
          $ref: "#/components/schemas/ConsentStatus"
          title: Status
          description: >-
            Estado de consentimento declarado pela empresa. Use GRANTED (com
            capturedAt) para consentimento explícito ou NOT_PROVIDED quando a
            empresa não tiver evidências a declarar.
          examples:
            - GRANTED
            - NOT_PROVIDED
        capturedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Captured At
          description: >-
            Data e hora ISO8601 (com milissegundos) em que a empresa obteve o
            consentimento. Obrigatório com status=GRANTED; null ou omissão são
            aceitos com status=NOT_PROVIDED.
          examples:
            - "2026-04-20T10:00:00.000Z"
            - null
      type: object
      required:
        - status
      title: OutboundConsentRequest
      description: Evidência de consentimento declarada pela empresa e registrada sem
        modificações na conversa.
    OutboundFollowUpRequest:
      properties:
        messageBody:
          type: string
          title: Message Body
          description: Corpo em texto simples da mensagem de acompanhamento.
          examples:
            - Just confirming we're still on for tomorrow at 10am.
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: >-
            O esquema da solicitação aceita o campo, mas o fluxo de saída
            compartilhado atual armazena os acompanhamentos apenas como texto e
            não anexa estes IDs de mídia. Para mídia do modelo inicial, use
            template.media; para uma mensagem de anexo separada, siga o fluxo de
            anexos de Message.
          examples:
            - []
            - - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
      type: object
      required:
        - messageBody
      title: OutboundFollowUpRequest
      description: Mensagem de acompanhamento pré-carregada armazenada na conversa
        junto ao modelo inicial.
    OutboundTemplateMedia:
      properties:
        type:
          $ref: "#/components/schemas/HeaderFileType"
          title: Media Type
          description: >-
            Tipo de mídia do cabeçalho. Deve corresponder ao tipo configurado
            para o modelo na Meta. Um cabeçalho `DOCUMENT` leva um PDF: um
            arquivo pré-carregado cujo nome não termina em `.pdf` é recusado.
          examples:
            - IMAGE
            - VIDEO
            - DOCUMENT
        mediaId:
          anyOf:
            - type: string
            - type: "null"
          title: Media Identifier
          description: >-
            UUID retornado por POST
            /bridge/api/v1/workspaces/{workspaceId}/files. Mutuamente exclusivo
            com url.
          examples:
            - null
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
        url:
          anyOf:
            - type: string
            - type: "null"
          title: Source URL
          description: >-
            URL pública de origem obtida de forma assíncrona pelo serviço de
            download de arquivos por URL. Mutuamente exclusiva com mediaId.
          examples:
            - null
            - https://cdn.example.com/promo.jpg
        fileName:
          anyOf:
            - type: string
            - type: "null"
          title: File Name
          description: >-
            Nome que o contato vê no PDF de um cabeçalho `DOCUMENT`. Só é válido
            para `DOCUMENT`; não pode ficar em branco, aceita no máximo 240
            caracteres e deve terminar em `.pdf`. Sem ele, o contato vê o nome
            do arquivo pré-carregado ou o último segmento do caminho da `url`,
            com `.pdf` acrescentado quando estiver faltando.
          examples:
            - null
            - Catalogo temporada.pdf
      type: object
      required:
        - type
      title: OutboundTemplateMedia
      description: >-
        Mídia opcional de cabeçalho anexada à mensagem do modelo inicial.


        Forneça exatamente um: ``mediaId`` (UUID retornado por ``POST
        /bridge/api/v1/workspaces/{workspaceId}/files``) ou ``url`` (URL pública
        de origem obtida de forma assíncrona pelo serviço de download por URL).
