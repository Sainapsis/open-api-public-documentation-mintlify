            cada um verificado conforme seu tipo (`TEXT` até 2000 caracteres); um
            valor `null`, um texto em branco e uma lista vazia são omitidos.
          examples:
          - budget: 15000000
            closeDate: '2026-12-15'
            segment: Retail
      additionalProperties: false
      type: object
      required:
      - contact
      title: CreatePipelineRecordBody
      description: Corpo da solicitação para criar um registro de pipeline.
