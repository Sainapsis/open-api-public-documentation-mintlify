      summary: Mover um registro de pipeline para outra etapa
      description: 'Move um registro aberto para outra etapa da versão do pipeline
        que ele segue; uma etapa final o fecha.


        Uma etapa que não está nessa versão, como uma de outro pipeline, falha com
        422 `BRIDGE_PIPELINE_0311`

        (`errRecordStage`), e a etapa em que o registro já está, com 409 `BRIDGE_PIPELINE_0004`.
        Um registro fechado

        falha com 409 `BRIDGE_PIPELINE_0306`: reabra-o primeiro. Quando a etapa exige
        um contato completo, um contato

        incompleto falha com 422 `BRIDGE_PIPELINE_0305`. Uma movimentação para uma
        etapa final pode levar um `reasonId` ativo

        do pipeline (422 `BRIDGE_PIPELINE_0315` quando não existe, `BRIDGE_PIPELINE_0314`
        quando está desativado)

        e um `reasonNote`; sem um motivo, o registro é fechado sem motivo. Um motivo
        ou uma nota em uma movimentação para uma etapa

        aberta falha com 422 `BRIDGE_PIPELINE_0311`. Com `expectedRevision`, um registro
        alterado desde que você o leu falha

        com 409 `BRIDGE_PIPELINE_0101`, cujo `extra.currentRecord` é o registro como
        está agora.


        `Idempotency-Key` é obrigatório e funciona como em `POST /records`: uma nova
        tentativa com a mesma chave e o mesmo corpo responde

        com o registro e `Idempotent-Replayed: true`, como está agora. A mesma chave
        em outro registro ou operação falha com

        422 `BRIDGE_PIPELINE_0402`.'
      operationId: move_pipeline_record_bridge_api_v1_workspaces__workspaceId__records__recordId__move_post
      security:
      - x-api-key: []
      parameters:
      - name: workspaceId
        in: path
