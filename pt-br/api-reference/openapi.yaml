          title: Status
          description: Status de aceitação da solicitação de transferência.
          examples:
            - ACCEPTED
        assignees:
          items:
            $ref: "#/components/schemas/HandoffAssignee"
          type: array
          title: Assignees
          description: Repete os destinatários recebidos na solicitação.
      type: object
      required:
