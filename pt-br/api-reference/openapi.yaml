  /bridge/api/v1/workspaces/{workspaceId}/records:
    post:
      tags:
      - Pipeline Records API
      summary: Criar um registro de pipeline
      description: 'Cria um registro de um contato em um pipeline, como uma oportunidade
        de venda.


        O contato é informado por exatamente um de `id`, `phone` ou `email` e precisa
        existir: nunca é criado (404

        `BRIDGE_EXTERNAL_0001`). `pipelineId` assume por padrão o pipeline padrão
        do workspace e `stageId` a

        etapa inicial do pipeline. Um `name` ausente ou em branco assume por padrão
        o nome completo do contato, depois seu

        celular e depois seu e-mail. Só são aceitas etapas abertas, e só atributos
        de escopo `RECORD` da

        versão atual do pipeline em `values` (um `null`, um texto em branco ou uma
        lista vazia é omitido); cada problema

        encontrado é listado em `extra.errors` do 422

        `BRIDGE_PIPELINE_0311`. Quando a etapa em que o registro começa exige um contato
        completo (nome, sobrenome,

        celular e todo atributo personalizado obrigatório do workspace), um contato
        incompleto falha com 422

        `BRIDGE_PIPELINE_0305`, cujo `extra.missing` indica o que falta. Um segundo
        registro com o mesmo `externalId`

        no pipeline falha com 409 `BRIDGE_PIPELINE_0003`, cujo `extra.recordId` é
        o registro existente.


        `Idempotency-Key` é obrigatório. Repetir com a mesma chave e o mesmo corpo
        responde 201 com o primeiro registro e

        `Idempotent-Replayed: true`. A mesma chave com um corpo diferente falha com
        422 `BRIDGE_PIPELINE_0402`, e

        enquanto a primeira solicitação ainda está em andamento, com 409 `BRIDGE_PIPELINE_0401`.
        Quando a solicitação falha, a chave é

        liberada e pode ser reutilizada. Se a primeira solicitação foi interrompida
        antes de terminar, sua chave continua respondendo 409

        `BRIDGE_PIPELINE_0401` por até 24 horas: tente de novo com uma chave nova
        e envie `externalId` para que uma nova tentativa nunca

        crie um segundo registro.'
      operationId: create_pipeline_record_bridge_api_v1_workspaces__workspaceId__records_post
      security:
      - x-api-key: []
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Identificador único do workspace (UUID v4).
          examples:
          - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
          title: Workspaceid
        description: Identificador único do workspace (UUID v4).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Uma chave que você escolhe para cada registro a criar, como
            o id de operação do seu sistema. Envie a mesma chave ao repetir a solicitação:
            por 24 horas ela responde com o registro que a primeira solicitação criou.'
          examples:
          - erp-opp-981-create
          title: Idempotency-Key
        description: 'Uma chave que você escolhe para cada registro a criar, como
          o id de operação do seu sistema. Envie a mesma chave ao repetir a solicitação:
          por 24 horas ela responde com o registro que a primeira solicitação criou.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePipelineRecordBody'
              description: Corpo da solicitação para criar um registro de pipeline.
      responses:
        '201':
          description: O registro foi criado, ou uma solicitação anterior com a mesma
            chave o criou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRecordResponse'
          headers:
            Location:
              description: URL do registro.
              schema:
                type: string
            Idempotent-Replayed:
              description: '`true` quando o registro vem de uma solicitação anterior
                com a mesma chave.'
              schema:
                type: string
                enum:
                - 'true'
        '429':
          description: Muitas solicitações
          content:
            application/json:
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Conteúdo não processável
          content:
            application/json:
              examples:
                INVALID_FIELD_FORMAT:
                  value:
                    title: Invalid Field Format
                    status: 422
                    code: BRIDGE_CORE_0101
                PIPELINE_RECORD_VALIDATION_FAILED:
                  value:
                    title: Pipeline Record Validation Failed
                    status: 422
                    code: BRIDGE_PIPELINE_0311
                CONTACT_INCOMPLETE:
                  value:
                    title: Contact Incomplete
                    status: 422
                    code: BRIDGE_PIPELINE_0305
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    title: Idempotency Key Reused
                    status: 422
                    code: BRIDGE_PIPELINE_0402
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Acesso proibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
                PIPELINES_DISABLED:
                  value:
                    title: Pipelines Disabled
                    status: 403
                    code: BRIDGE_PIPELINE_0301
                PIPELINE_ENTRY_DISABLED:
                  value:
                    title: Pipeline Entry Disabled
                    status: 403
                    code: BRIDGE_PIPELINE_0317
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Não encontrado
          content:
            application/json:
              examples:
                WORKSPACE_NOT_FOUND:
                  value:
                    title: Workspace Not Found
                    status: 404
                    code: BRIDGE_WORKSPACE_0001
                EXTERNAL_USER_NOT_FOUND:
                  value:
                    title: External User Not Found
                    status: 404
                    code: BRIDGE_EXTERNAL_0001
                PIPELINE_NOT_FOUND:
                  value:
                    title: Pipeline Not Found
                    status: 404
                    code: BRIDGE_PIPELINE_0201
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflito
          content:
            application/json:
              examples:
                PIPELINE_RECORD_EXTERNAL_ID_TAKEN:
                  value:
                    title: Pipeline Record External Id Taken
                    status: 409
                    code: BRIDGE_PIPELINE_0003
                IDEMPOTENCY_REQUEST_IN_PROGRESS:
                  value:
                    title: Idempotency Request In Progress
                    status: 409
                    code: BRIDGE_PIPELINE_0401
              schema:
                $ref: '#/components/schemas/Problem'
    get:
