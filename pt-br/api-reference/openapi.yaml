          title: Idempotency-Key
        description: 'Uma chave que você escolhe para cada alteração, como o id de
          operação do seu sistema. Envie a mesma chave ao repetir a solicitação: por
          24 horas ela responde com o registro que a primeira solicitação alterou.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovePipelineRecordBody'
              description: Corpo da solicitação para mover um registro de pipeline
                para outra etapa do seu pipeline.
      responses:
        '200':
          description: O registro como fica após a alteração, ou após uma solicitação
