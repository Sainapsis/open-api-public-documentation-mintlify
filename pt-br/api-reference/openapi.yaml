  /bridge/api/v1/workspaces/{workspaceId}/leadscout/outbound:
    post:
      tags:
        - LeadScout API
      summary: Iniciar conversa de saída do LeadScout com um lead conhecido
      description: >-
        Inicia uma conversa de saída do LeadScout com um Contact conhecido. O
        Contact já deve existir. A Bridge seleciona um Agent de prospecção para
        uma linha de WhatsApp elegível. O template é referenciado por
        template.id ou template.name; id tem precedência quando ambos são
        informados. Ele deve existir e estar APPROVED, e qualquer Bridge User de
        handoffOverride deve ser válido.


        Um contact.providerChannelId explícito é respeitado. Sem ele, a seleção
        automática prefere uma linha livre, depois uma conversa liberada
        recuperável com este Contact e, por último, uma conversa ativa ocupada
        somente quando forceSend=true. A disponibilidade é avaliada por Contact
        em cada linha, não pela ocupação global da linha.


        forceSend=true reutiliza uma conversa ativa elegível; não a ignora nem
        cria uma nova. Uma reutilização bem-sucedida retorna
        alreadyInitiated=true e persiste o novo template e os acompanhamentos.
        Uma conversa liberada recuperável pode ser recuperada com qualquer um
        dos valores, mantém seu ID e retorna recovered=true. Esta opção não
        torna utilizáveis as conversas bloqueadas nem as liberadas não
        recuperáveis. A rota legada pode reutilizar uma conversa controlada por
        um humano ou outro Agent; ao contrário da saída de Agents, ela não exige
        a verificação de controle pelo Agent solicitado.


        Uma sessão aberta do LeadScout ainda não expirada continua bloqueando
        uma nova solicitação de saída com 409 BRIDGE_AI_LEADSCOUT_0017; a
        impossibilidade de finalizar uma sessão expirada retorna 409
        BRIDGE_AI_LEADSCOUT_0018. As outras validações continuam valendo. As
        mensagens adicionais são persistidas; a persistência não comprova a
        entrega nem uma espera pela resposta do lead. Uma solicitação com falha
        pode deixar trabalho parcial, portanto não trate forceSend como
        idempotência nem repita às cegas uma solicitação com resultado incerto.


        Consulte [o guia completo de saída](/pt-br/guides/agent-outbound) para a
        matriz false/true, os indicadores de resposta, as diferenças em relação
        à saída de Agents, os erros e a transferência.
      operationId: initiate_leadscout_outbound_bridge_api_v1_workspaces__workspaceId__leadscout_outbound_post
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único do workspace (UUID v4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadscoutOutboundRequest"
              description: Corpo da solicitação para iniciar uma conversa de saída do
                LeadScout.
      responses:
        "201":
          description: Resposta bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadscoutOutboundResponse"
        "400":
          description: Solicitação inválida
          content:
            application/json:
              examples:
                OUTBOUND_VALIDATION_ERROR:
                  value:
                    title: Outbound Validation Error
                    status: 400
                    code: BRIDGE_AI_LEADSCOUT_0016
                TEMPLATE_ORDERED_PARAMS_MISMATCH:
                  value:
                    title: Template Params Mismatch
                    status: 400
                    code: BRIDGE_AI_LEADSCOUT_0006
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Não encontrado
          content:
            application/json:
              examples:
                EXTERNAL_USER_NOT_FOUND:
                  value:
                    title: External User Not Found
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0001
                INTERNAL_USER_NOT_FOUND:
                  value:
                    title: Internal User Not Found
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0002
                TEMPLATE_NOT_FOUND:
                  value:
                    title: Template Not Found
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0004
                NO_CHANNELS_FOR_BRAND:
                  value:
                    title: No Channels For Brand
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0009
                PROVIDER_CHANNEL_NOT_IN_WORKSPACE:
                  value:
                    title: Channel Not In Workspace
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0010
                WORKSPACE_HAS_NO_PROVIDER_CHANNELS:
                  value:
                    title: No Provider Channels
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0011
                NO_PROSPECTING_AGENT_FOR_CHANNEL:
                  value:
                    title: No Agent For Channel
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0012
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflito
          content:
            application/json:
              examples:
                INTERNAL_USER_DELETED:
                  value:
                    title: Internal User Deleted
                    status: 409
                    code: BRIDGE_AI_LEADSCOUT_0003
                TEMPLATE_NOT_APPROVED:
                  value:
                    title: Template Not Approved
                    status: 409
                    code: BRIDGE_AI_LEADSCOUT_0005
                ACTIVE_CONVERSATION_ALREADY_EXISTS:
                  value:
                    title: Active Conversation Exists
                    status: 409
                    code: BRIDGE_AI_LEADSCOUT_0007
                ALL_PROVIDER_CHANNELS_OCCUPIED:
                  value:
                    title: All Channels Occupied
                    status: 409
                    code: BRIDGE_AI_LEADSCOUT_0008
                MULTIPLE_PROSPECTING_AGENTS_FOR_BRAND:
                  value:
                    title: Multiple Agents For Brand
                    status: 409
                    code: BRIDGE_AI_LEADSCOUT_0013
                MULTIPLE_PROSPECTING_AGENTS_FOR_CHANNEL:
                  value:
                    title: Multiple Agents For Channel
                    status: 409
                    code: BRIDGE_AI_LEADSCOUT_0014
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Conteúdo não processável
          content:
            application/json:
              examples:
