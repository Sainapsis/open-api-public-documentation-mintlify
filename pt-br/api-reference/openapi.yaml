            interpretado como o celular ao gravar um contato: sem código de
            país, usa-se o país padrão do workspace, ignorando espaços e
            separadores. Em um `EMAIL`, o domínio é convertido para minúsculas,
            mas a parte local deve corresponder exatamente ao valor enviado.
          examples:
            cellphone:
              summary: A cellphone
              description: >-
                Send with `type=PHONE`. A value that cannot be read as a
                cellphone is refused before any lookup happens.
