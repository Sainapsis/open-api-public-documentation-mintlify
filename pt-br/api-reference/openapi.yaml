          examples:
            - WHATSAPP
            - null
        providerChannelId:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Channel Identifier
          description: ID do canal do provedor usado pelo Bridge para se comunicar com o
            usuário.
        brandId:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Identifier
          description: >-
            Marca proprietária da linha corporativa usada para contatar o
            usuário. Quando o workspace tem pelo menos uma linha com marca, a
            seleção automática de linhas é limitada a essa marca e a solicitação
            deve incluir brandId ou providerChannelId; a ausência de ambos é
            rejeitada. Ignorado quando o workspace não tem linhas com marca.
      type: object
      required:
        - identifier
        - identifierType
      title: ExternalUserIdentifierRequest
      description: Corpo para identificar um usuário externo no Bridge.
    ExternalUserType:
      type: string
      enum:
