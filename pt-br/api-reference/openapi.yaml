  /bridge/api/v1/workspaces/{workspaceId}/agents/{agentId}/outbound:
    post:
      tags:
        - Agents API
      summary: Iniciar conversa de saída com um Contact como Agent específico
      description: >-
        Inicia uma conversa de saída com um Contact conhecido, atendida pelo
        Agent indicado.


        Funciona com Agents LeadScout e Service. Primeiro é resolvido o Contact
        e depois o Agent, que deve existir no workspace e estar disponível
        (consulte `GET /agents`). O template é referenciado por `template.id` ou
        `template.name` (id tem precedência quando ambos são enviados), deve
        existir e estar APPROVED, e qualquer Bridge User de `handoffOverride`
        deve ser válido. Se `template.media.mediaId` for desconhecido, a
        solicitação falha com 400 `BRIDGE_AI_LEADSCOUT_0016` somente depois de a
        conversa ser criada ou recuperada, portanto uma nova tentativa após esse
        erro pode responder de forma diferente. As regras do corpo
        (`consent.status=GRANTED` sem `capturedAt`, ou `template.media` sem
        exatamente um de `mediaId` ou `url`) falham com 400 `BRIDGE_CORE_0103`.


        A conversa é aberta em uma das linhas ativas de WhatsApp do Agent, sob
        seu controle, com o template como primeira mensagem. A linha é escolhida
        nesta ordem:

        - Uma linha livre.

        - Caso contrário, uma linha com uma conversa liberada recuperável com
        este Contact. A recuperação retorna `recovered=true` e substitui o
        contexto de saída anterior e `agentContext`. Isso acontece mesmo com
        `forceSend=false`.

        - Se nenhuma linha estiver livre ou for recuperável: `forceSend=false`
        (padrão) falha com 409 `BRIDGE_AI_LEADSCOUT_0008`; `forceSend=true`
        reutiliza uma linha ocupada por uma conversa ativa com este Contact,
        dando preferência a uma controlada por este Agent. Se a conversa
        escolhida for controlada por outro Agent ou por um Bridge User, a
        chamada falha com 409 `BRIDGE_AI_AGENT_OUTBOUND_0006` e nada é gravado.
        Libere-a primeiro e tente novamente. Linhas cuja conversa está bloqueada
        ou foi liberada sem recuperação nunca são usadas; assim, se nenhuma
        linha estiver ocupada por uma conversa ativa, a chamada falha com 409
        `BRIDGE_AI_LEADSCOUT_0008` mesmo com `forceSend=true`.


        `contact.providerChannelId` é uma preferência: a linha indicada é usada
        quando está livre ou é recuperável; caso contrário, a mesma ordem é
        aplicada entre todas as linhas do Agent. Entre as linhas ocupadas, uma
        controlada por este Agent tem prioridade; se nenhuma for, a linha
        indicada é reutilizada (e pode falhar com 0006).


        A reutilização de uma conversa depende do tipo de Agent:

        - LeadScout: se sua sessão do LeadScout ainda estiver aberta e não
        expirada, a chamada falha com 409 `BRIDGE_AI_LEADSCOUT_0017` (`extra`
        inclui `conversationId`, `sessionId` e `stage`). Se uma sessão expirada
        não puder ser finalizada, falha com 409 `BRIDGE_AI_LEADSCOUT_0018`.

        - Service Agent: uma sessão de serviço aberta e não expirada continua;
        uma sessão expirada é encerrada como abandonada e uma nova é aberta.


        Consulte [o guia completo de saída](/pt-br/guides/agent-outbound) para
        os pré-requisitos, a tabela de decisão de forceSend, a recuperação, o
        trabalho parcial e as decisões seguras de nova tentativa.
      operationId: start_agent_outbound_bridge_api_v1_workspaces__workspaceId__agents__agentId__outbound_post
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único do workspace (UUID v4).
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do Agent (UUID v4), conforme `GET /agents`.
            examples:
              - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
            title: Agentid
          description: Identificador único do Agent (UUID v4), conforme `GET /agents`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentOutboundRequest"
              description: Corpo da solicitação para iniciar uma conversa de saída atendida
                por um Agent específico.
      responses:
        "201":
          description: Resposta bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOutboundResponse"
        "400":
          description: Solicitação inválida
          content:
            application/json:
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    status: 400
                    code: BRIDGE_CORE_0103
                OUTBOUND_VALIDATION_ERROR:
                  value:
                    title: Outbound Validation Error
                    status: 400
                    code: BRIDGE_AI_LEADSCOUT_0016
                TEMPLATE_ORDERED_PARAMS_MISMATCH:
                  value:
                    title: Template Params Mismatch
                    status: 400
                    code: BRIDGE_AI_LEADSCOUT_0006
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Acesso proibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Não encontrado
          content:
            application/json:
              examples:
                AGENT_NOT_FOUND:
                  value:
                    title: Agent Not Found
                    status: 404
                    code: BRIDGE_AI_AGENT_OUTBOUND_0001
                NO_CHANNELS_FOR_AGENT:
                  value:
                    title: No Channels For Agent
                    status: 404
                    code: BRIDGE_AI_AGENT_OUTBOUND_0004
                EXTERNAL_USER_NOT_FOUND:
                  value:
                    title: External User Not Found
                    status: 404
