        identifierType:
          $ref: "#/components/schemas/InternalParticipantIdentifierType"
          title: Identifier Type
          description: Tipo de identificador de usuários internos (ID ou EMAIL).
          examples:
            - EMAIL
            - ID
      type: object
      required:
        - identifier
