          description: Identificador único do workspace (UUID v4).
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ParticipantIdentifierType"
            description: Tipo de identificador usado para informar o valor.
          description: Tipo de identificador usado para informar o valor.
        - name: value
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 320
            description: >-
              O identificador no formato indicado por `type`. Um `PHONE` é
              interpretado como o celular ao gravar um contato: sem código de
              país, usa-se o país padrão do workspace, ignorando espaços e
              separadores. Em um `EMAIL`, o domínio é convertido para
              minúsculas, mas a parte local deve corresponder exatamente ao
              valor enviado.
            title: Value
