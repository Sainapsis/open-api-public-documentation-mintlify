openapi: 3.1.0
info:
  title: Bridge API
  summary: Especificação da API do Bridge para gerenciar o sistema de chat.
  description: >-
    Especificação da API REST de integrações do Bridge para gerenciar contatos,
    conversas, mensagens, arquivos, atributos personalizados, canais de
    provedores, modelos, usuários internos e Agents.


    Os webhooks são documentados separadamente em
    https://docs.bridge.new/pt-br/webhooks; este OpenAPI contém apenas endpoints
    REST.


    **Arquitetura multiempresa**: as operações sobre recursos são limitadas a um
    workspace específico por workspaceId. A verificação de integridade não
    inclui um workspace no caminho.
  termsOfService: https://www.sainapsis.com/legal/terms-of-service
  contact:
    name: Bridge Support
    url: https://app.bridge.new/
    email: support@sainapsis.com
  license:
    name: MIT License
    url: https://spdx.org/licenses/MIT.html
  version: 1.0.0
servers:
  - url: https://api-connect-us.bridge.new
    description: Servidor de produção
paths:
  /bridge/api/health:
    get:
      tags:
        - Health
      summary: Verificar integridade
      description: Endpoint de verificação de integridade para confirmar que a API
        está em funcionamento.
      operationId: health_bridge_api_health_get
      responses:
        "200":
          description: Resposta bem-sucedida
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Bridge Api Health Get
        "429":
          description: Muitas solicitações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
      security:
        - x-api-key: []
  /bridge/api/v1/workspaces/{workspaceId}/conversations/{conversationId}:
    get:
      tags:
        - Conversations API
      summary: Obter conversa por ID
      description: Obtém uma conversa específica pelo seu identificador único no workspace.
      operationId: get_conversation_by_id_bridge_api_v1_workspaces__workspaceId__conversations__conversationId__get
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único do workspace (UUID v4).
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da conversa (UUID v4).
            examples:
              - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
            title: Conversationid
          description: Identificador único da conversa (UUID v4).
      responses:
        "200":
          description: Resposta bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "403":
          description: Acesso proibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Não encontrado
          content:
            application/json:
              examples:
                CONVERSATION_NOT_FOUND:
                  value:
                    title: Conversation Not Found
                    status: 404
                    code: BRIDGE_CONVERSATION_0001
                CONVERSATION_NOT_IN_WORKSPACE:
                  value:
                    title: Conversation Not In Workspace
                    status: 404
                    code: BRIDGE_CONVERSATION_0002
                WORKSPACE_NOT_FOUND:
                  value:
                    title: Workspace Not Found
                    status: 404
                    code: BRIDGE_WORKSPACE_0001
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "429":
          description: Muitas solicitações
          content:
            application/json:
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags:
        - Conversations API
      summary: Atualizar conversa
      description: |-
        Atualiza os detalhes da conversa, incluindo participantes, status e nome.

        Aceita atualizações parciais: inclua apenas os campos que deseja alterar.
      operationId: update_conversation_bridge_api_v1_workspaces__workspaceId__conversations__conversationId__patch
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único do workspace (UUID v4).
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da conversa (UUID v4).
            examples:
              - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
            title: Conversationid
          description: Identificador único da conversa (UUID v4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversation"
              description: Corpo da solicitação para atualizar uma conversa existente.
      responses:
        "200":
          description: Resposta bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "403":
          description: Acesso proibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Não encontrado
          content:
            application/json:
              examples:
                CONVERSATION_NOT_FOUND:
                  value:
                    title: Conversation Not Found
                    status: 404
                    code: BRIDGE_CONVERSATION_0001
                CONVERSATION_NOT_IN_WORKSPACE:
                  value:
                    title: Conversation Not In Workspace
                    status: 404
                    code: BRIDGE_CONVERSATION_0002
                WORKSPACE_NOT_FOUND:
                  value:
                    title: Workspace Not Found
                    status: 404
                    code: BRIDGE_WORKSPACE_0001
                EXTERNAL_USER_NOT_FOUND:
                  value:
                    title: External User Not Found
                    status: 404
                    code: BRIDGE_EXTERNAL_0001
                INTERNAL_USER_NOT_FOUND:
                  value:
                    title: Internal User Not Found
                    status: 404
                    code: BRIDGE_INTERNAL_0001
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflito
          content:
            application/json:
              examples:
                INTERNAL_USER_ALREADY_IN_CONVERSATION:
                  value:
                    title: Internal User Already In Conversation
                    status: 409
                    code: BRIDGE_CONVERSATION_0101
                EXTERNAL_USER_ALREADY_IN_CONVERSATION:
                  value:
                    title: External User Already In Conversation
                    status: 409
                    code: BRIDGE_CONVERSATION_0103
                INTERNAL_USER_NOT_IN_CONVERSATION:
                  value:
                    title: Internal User Not In Conversation
                    status: 409
                    code: BRIDGE_CONVERSATION_0102
                EXTERNAL_USER_NOT_IN_CONVERSATION:
                  value:
                    title: External User Not In Conversation
                    status: 409
                    code: BRIDGE_CONVERSATION_0104
                LAST_ADMIN_REMOVAL_FORBIDDEN:
                  value:
                    title: Last Admin Removal Forbidden
                    status: 409
                    code: BRIDGE_CONVERSATION_0204
                MIN_INTERNAL_USERS_REQUIRED:
                  value:
                    title: Min Internal Users Required
                    status: 409
                    code: BRIDGE_CONVERSATION_0205
                EXTERNAL_USER_NOT_IN_WORKSPACE:
                  value:
                    title: External User Not In Workspace
                    status: 409
                    code: BRIDGE_EXTERNAL_0004
                INTERNAL_USERS_NOT_IN_WORKSPACE:
                  value:
                    title: Internal Users Not In Workspace
                    status: 409
                    code: BRIDGE_INTERNAL_0002
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "429":
          description: Muitas solicitações
          content:
            application/json:
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
              schema:
                $ref: "#/components/schemas/Problem"
  /bridge/api/v1/workspaces/{workspaceId}/conversations:
    get:
      tags:
        - Conversations API
      summary: Consultar conversas com filtros flexíveis
      description: >-
        Consulta conversas com opções flexíveis de filtragem.


        Permite buscar por identificadores de usuários externos (ID, e-mail ou
        telefone) ou por participantes internos, com paginação e filtro por
        status.
      operationId: get_conversations_bridge_api_v1_workspaces__workspaceId__conversations_get
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único do workspace (UUID v4).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Número de conversas por página
            default: 20
            title: Limit
          description: Número de conversas por página
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Cursor recebido na solicitação anterior para obter a próxima página
            title: Cursor
          description: Cursor recebido na solicitação anterior para obter a próxima página
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Status
            description: Status da conversa
            enum:
              - ACTIVE
              - GHOST
              - RELEASED
              - NOT_ASSIGNED_TO_HUMAN
              - BLOCKED
          description: Status da conversa
        - name: internalUserIdentifier
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: >-
              Identificador do usuário interno. Ao enviar um número de telefone,
              codifique corretamente a URL da solicitação, incluindo seus
              parâmetros.
            title: Internaluseridentifier
          description: >-
            Identificador do usuário interno. Ao enviar um número de telefone,
            codifique corretamente a URL da solicitação, incluindo seus
            parâmetros.
        - name: internalUserIdentifierType
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            enum:
              - ID
              - EMAIL
            title: Internaluseridentifiertype
        - name: externalUserIdentifier
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Externaluseridentifier
        - name: externalUserIdentifierType
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Externaluseridentifiertype
            enum:
              - ID
              - EMAIL
              - PHONE
      responses:
        "200":
          description: Resposta bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "400":
          description: Solicitação inválida
          content:
            application/json:
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    status: 400
                    code: BRIDGE_CORE_0103
                INVALID_CURSOR:
                  value:
                    title: Invalid Cursor
                    status: 400
                    code: BRIDGE_CORE_0104
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Acesso proibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Não encontrado
          content:
            application/json:
              examples:
                WORKSPACE_NOT_FOUND:
                  value:
                    title: Workspace Not Found
                    status: 404
                    code: BRIDGE_WORKSPACE_0001
                INTERNAL_USER_NOT_FOUND:
                  value:
                    title: Internal User Not Found
                    status: 404
                    code: BRIDGE_INTERNAL_0001
                EXTERNAL_USER_NOT_FOUND:
                  value:
                    title: External User Not Found
                    status: 404
                    code: BRIDGE_EXTERNAL_0001
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflito
          content:
            application/json:
              examples:
                INTERNAL_USERS_NOT_IN_WORKSPACE:
                  value:
                    title: Internal Users Not In Workspace
                    status: 409
                    code: BRIDGE_INTERNAL_0002
                EXTERNAL_USER_NOT_IN_WORKSPACE:
                  value:
                    title: External User Not In Workspace
                    status: 409
                    code: BRIDGE_EXTERNAL_0004
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "429":
          description: Muitas solicitações
          content:
            application/json:
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
        - Conversations API
      summary: Criar conversa com identificação flexível de usuários
      description: >-
        Cria uma conversa com identificação flexível de usuários.


        Os usuários externos podem ser identificados por ID, e-mail ou telefone.
        Usuários internos só são atribuídos quando informados explicitamente;
        caso contrário, as conversas são distribuídas em rodízio por uma equipe
        ou ficam abertas para qualquer usuário interno disponível.


        Quando não há uma linha livre e os Contacts têm uma conversa liberada
        com exatamente os participantes solicitados, essa conversa é recuperada
        e retornada, mantendo seu `id` e histórico. O `name` e o `status` da
        solicitação não são aplicados a ela.
      operationId: create_conversation_bridge_api_v1_workspaces__workspaceId__conversations_post
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único do workspace (UUID v4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
              description: Corpo da solicitação para criar uma conversa.
      responses:
        "201":
          description: Resposta bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "400":
          description: Solicitação inválida
          content:
            application/json:
              examples:
                MIN_PARTICIPANTS_REQUIRED:
                  value:
                    title: Min Participants Required
                    status: 400
                    code: BRIDGE_CONVERSATION_0210
                ONBOARDING_TEMPLATE_NOT_IN_WORKSPACE:
                  value:
                    title: Onboarding Template Not In Workspace
                    status: 400
                    code: BRIDGE_CONVERSATION_0602
                ONBOARDING_TEMPLATE_NOT_APPROVED:
                  value:
                    title: Onboarding Template Not Approved
                    status: 400
                    code: BRIDGE_CONVERSATION_0603
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Acesso proibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Não encontrado
          content:
            application/json:
              examples:
                WORKSPACE_NOT_FOUND:
                  value:
                    title: Workspace Not Found
                    status: 404
                    code: BRIDGE_WORKSPACE_0001
                EXTERNAL_USER_NOT_FOUND:
                  value:
                    title: External User Not Found
                    status: 404
                    code: BRIDGE_EXTERNAL_0001
                INTERNAL_USER_NOT_FOUND:
                  value:
                    title: Internal User Not Found
                    status: 404
                    code: BRIDGE_INTERNAL_0001
                ONBOARDING_TEMPLATE_NOT_FOUND:
                  value:
                    title: Onboarding Template Not Found
                    status: 404
                    code: BRIDGE_CONVERSATION_0601
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflito
          content:
            application/json:
              examples:
                CONVERSATION_WITH_SAME_PARTICIPANTS_ALREADY_EXISTS:
                  value:
                    title: Conversation With Same Participants Already Exists
                    status: 409
                    code: BRIDGE_CONVERSATION_0003
                EXTERNAL_USER_NOT_IN_WORKSPACE:
                  value:
                    title: External User Not In Workspace
                    status: 409
                    code: BRIDGE_EXTERNAL_0004
                INTERNAL_USERS_NOT_IN_WORKSPACE:
                  value:
                    title: Internal Users Not In Workspace
                    status: 409
                    code: BRIDGE_INTERNAL_0002
                PROVIDER_CHANNEL_NOT_FOUND:
                  value:
                    title: Provider Channel Not Found
                    status: 409
                    code: BRIDGE_PROVIDER_CHANNEL_0001
                EXTERNAL_USER_ALREADY_USE_THIS_CHANNEL:
                  value:
                    title: External User Already Use This Channel
                    status: 409
                    code: BRIDGE_CONVERSATION_0105
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Conteúdo não processável
          content:
            application/json:
              examples:
                ONBOARDING_TEMPLATE_MISSING_PARAMETERS:
                  value:
                    title: Onboarding Template Missing Parameters
                    status: 422
                    code: BRIDGE_CONVERSATION_0604
                ONBOARDING_TEMPLATE_UNKNOWN_PARAMETERS:
                  value:
                    title: Onboarding Template Unknown Parameters
                    status: 422
                    code: BRIDGE_CONVERSATION_0605
                ONBOARDING_TEMPLATE_PARAMETERS_NOT_SUPPORTED:
                  value:
                    title: Onboarding Template Parameters Not Supported
                    status: 422
                    code: BRIDGE_CONVERSATION_0606
                ONBOARDING_TEMPLATE_INVALID_PARAMETER_VALUES:
                  value:
                    title: Onboarding Template Invalid Parameter Values
                    status: 422
                    code: BRIDGE_CONVERSATION_0607
                ONBOARDING_CONFIGURED_TEMPLATE_REQUIRES_CALLER_INPUT:
                  value:
                    title: Onboarding Configured Template Requires Caller Input
                    status: 422
                    code: BRIDGE_CONVERSATION_0608
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Muitas solicitações
          content:
            application/json:
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
              schema:
                $ref: "#/components/schemas/Problem"
  /bridge/api/v1/workspaces/{workspaceId}/conversations/{conversationId}/release:
    post:
      tags:
        - Conversations API
      summary: Liberar conversa
      description: >-
        Libera uma conversa: marca-a como liberada, remove os participantes
        externos e move-a para a seção RELEASED.
      operationId: >-
        release_conversation_bridge_api_v1_workspaces__workspaceId__conversations__conversationId__release_post
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único do workspace (UUID v4).
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da conversa (UUID v4).
            examples:
              - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
            title: Conversationid
          description: Identificador único da conversa (UUID v4).
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/ReleaseConversationBody"
                - type: "null"
              description: Corpo do POST para liberar uma conversa. O motivo é opcional.
              title: Body
      responses:
        "204":
          description: Resposta bem-sucedida
        "400":
          description: Solicitação inválida
          content:
            application/json:
              examples:
                CONVERSATION_NOT_IN_WORKSPACE:
                  value:
                    title: Conversation Not In Workspace
                    status: 400
                    code: BRIDGE_CONVERSATION_0002
                CONVERSATION_NOT_ACTIVE:
                  value:
                    title: Conversation Not Active
                    status: 400
                    code: BRIDGE_CONVERSATION_0004
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Acesso proibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Não encontrado
          content:
            application/json:
              examples:
                WORKSPACE_NOT_FOUND:
                  value:
                    title: Workspace Not Found
                    status: 404
                    code: BRIDGE_WORKSPACE_0001
                CONVERSATION_NOT_FOUND:
                  value:
                    title: Conversation Not Found
                    status: 404
                    code: BRIDGE_CONVERSATION_0001
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflito
          content:
            application/json:
              examples:
                WORKSPACE_WITHOUT_CONFIGURED_FIELD:
                  value:
                    title: Workspace Without Configured Field
                    status: 409
                    code: BRIDGE_WORKSPACE_0004
                CONVERSATION_WITH_INCONSISTENT_STATE:
                  value:
                    title: Conversation With Inconsistent State
                    status: 409
                    code: BRIDGE_CONVERSATION_0006
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "429":
          description: Muitas solicitações
          content:
            application/json:
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
              schema:
                $ref: "#/components/schemas/Problem"
  /bridge/api/v1/workspaces/{workspaceId}/messages:
    post:
      tags:
        - Messages API
      summary: Criar mensagem
      description: >-
        Cria uma mensagem em uma conversa específica.


        Para uma mensagem de texto ou um anexo enviado, inclua todos os campos
        obrigatórios: `conversationId`, `messageBody` e
        `enableExternalBroadcast`. Anexe os arquivos enviados usando os
        identificadores retornados em `mediaIds`; consulte [Enviar um
        anexo](/pt-br/guides/send-attachments). Uma resposta bem-sucedida
        retorna `messageId`; não contém uma confirmação de entrega do provedor.
        Consulte [Respostas e novas tentativas](/pt-br/guides/responses).
      operationId: create_message_bridge_api_v1_workspaces__workspaceId__messages_post
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
