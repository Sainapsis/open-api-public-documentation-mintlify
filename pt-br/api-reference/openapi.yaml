  /bridge/api/v1/workspaces/{workspaceId}/templates/{templateId}:
    get:
      tags:
        - Templates API
      summary: Descobrir as variáveis agnósticas de um modelo
      description: >-
        Retorna as variáveis de um template:
        `key`/`label`/`callerMustSupply`/`isCustom`/`default`, independentes da
        posição na Meta.


        Nunca retorna o endereço ou índice de uma posição da Meta.


        `templateId` aceita o `id` ou o `name` do template. As operações de
        saída aceitam `template.id` ou `template.name`, com precedência para um
        id não vazio. A abertura de conversas usa
        `onboardingTemplates[].templateId`. Use o seletor exigido pela operação
        de envio. Consulte [a receita de
        templates](/pt-br/guides/send-template).


        Uma variável com `callerMustSupply: true` não tem uma fonte declarada:
        quem chama deve incluir sua `key` em `parameters` ao enviar; caso
        contrário, o envio falha com um 422 que identifica a mesma `key`.

        Uma variável com `callerMustSupply: false` é resolvida pela própria
        Bridge, por exemplo, o primeiro nome do destinatário, ou já tem um valor
        que quem chama pode substituir opcionalmente.

        Uma variável com `isCustom: true` é um valor conhecido apenas por quem
        chama e tem um `default`: envie-a em `parameters` para usar seu próprio
        valor, ou omita-a ou deixe-a em branco para enviar `default`.


        Códigos de erro:

        - BRIDGE_CORE_0301: o workspace na rota não corresponde ao workspace de
        quem chama (403)

        - BRIDGE_TEMPLATE_0001: nenhuma PROVIDER_TEMPLATE foi encontrada para
        este workspace e identificador. Abrange igualmente um id/name
        desconhecido, um template de outro workspace e um template que não é
        PROVIDER_TEMPLATE (404); este endpoint nunca confirma a existência de um
        template fora do workspace de quem chama
      operationId: get_template_discovery_bridge_api_v1_workspaces__workspaceId__templates__templateId__get
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único do workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único do workspace (UUID v4).
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            description: "ID ou nome do modelo: ambos identificam o mesmo modelo."
            examples:
              - order_shipped_promo
              - f0000040-0000-4000-8000-000000000040
            title: Templateid
          description: "ID ou nome do modelo: ambos identificam o mesmo modelo."
      responses:
        "200":
          description: Resposta bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDiscoveryResponse"
        "403":
          description: Acesso proibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
