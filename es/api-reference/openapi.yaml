  /bridge/api/v1/workspaces/{workspaceId}/files:
    post:
      tags:
        - Files API
      summary: Crear cargas prefirmadas de archivos
      description: >-
        Carga un archivo adjunto, como un PDF, una imagen o un documento, antes
        de crear un mensaje. Esta operación devuelve los datos de un PUT
        prefirmado; los bytes del archivo se cargan por separado. Cuando la
        carga termine correctamente, utiliza el `mediaId` devuelto en la
        operación de envío. Sigue [Enviar un archivo
        adjunto](/es/guides/send-attachments) para los pasos de suma de
        comprobación, carga y mensaje.


        Genera URL prefirmadas para cargar archivos (Presigned PUT). Valida la
        extensión, contentType y los límites por tipo. La suma de comprobación
        es obligatoria: envía el resumen SHA-256 en checksumBase64 (Base64). La
        carga debe incluir la cabecera x-amz-checksum-sha256 con el mismo valor.


        ---

        Para cargar los archivos, DEBES utilizar la URL prefirmada devuelta con
        el método HTTP PUT. Carga el archivo exactamente en la URL indicada, sin
        modificaciones, tal como exige AWS S3 para un PUT con URL prefirmada.
        Consulta la documentación oficial de AWS S3: [Documentación de AWS S3
        sobre Presigned
        PUT](https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html).

        Incluye todas las cabeceras obligatorias indicadas en la respuesta, por
        ejemplo, 'x-amz-checksum-sha256' con el valor SHA-256 correcto. AWS
        rechazará la carga si no utilizas el método HTTP o las cabeceras
        correctos.


