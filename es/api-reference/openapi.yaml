    CreateConversationRequest:
      properties:
        participants:
          $ref: "#/components/schemas/CreateParticipantsOnConversationRequest"
          title: Participants
          description: Participantes que se agregarán a la conversación.
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
          description: Nombre o título opcional de la conversación.
          examples:
            - Bridge Support Team
            - null
        status:
          $ref: "#/components/schemas/ConversationStatus"
          title: Status
          description: >-
            Estado inicial de la conversación: 'active' para conversaciones
            visibles y 'ghost' para conversaciones invisibles hasta la primera
            interacción.
          default: ACTIVE
          examples:
            - ACTIVE
        teamId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Team Identifier
          description: >-
            UUID del equipo para la asignación por turnos (opcional y mutuamente
            excluyente con internalParticipants).
          examples:
            - 9fd1468d-e5ca-4ba3-98d1-13017e6f3808
        onboardingTemplates:
          items:
            $ref: "#/components/schemas/OnboardingTemplateRequest"
          type: array
          title: Onboarding Templates
          description: >-
            Plantillas ordenadas con las que abrir la conversación. Reemplazan
            la secuencia de inicio configurada en el workspace para esta
            conversación, en su totalidad o solo su primera plantilla, según la
            configuración del workspace; en el segundo caso, el resto de la
            secuencia configurada se envía después de las tuyas. La posición
            determina el orden. Omite este campo para conservar el valor
            predeterminado del workspace. Cada plantilla debe existir,
            pertenecer a tu workspace o al ámbito de la plataforma y, para
            plantillas de proveedor de WhatsApp, estar aprobada por Meta para la
            WhatsApp Business Account de la línea por la que se contacta a cada
            participante; de lo contrario, se rechaza la solicitud y no se crea
            ninguna conversación. Una plantilla cuyas variables necesiten
            valores que solo tú puedas proporcionar los recibe en los
            `parameters` de la entrada. Si una de las plantillas configuradas
            que se envían después de las tuyas necesita valores que solo pueda
            proporcionar quien llama, la solicitud se rechaza con 422
            `BRIDGE_CONVERSATION_0608`, con `extra.templateId` identificando esa
            plantilla y `extra.origin` establecido en `WORKSPACE_CONFIGURATION`.
            Cambiar la solicitud no ayudará: pide a un administrador del
            workspace que cambie la secuencia de inicio.
      additionalProperties: false
      type: object
      required:
        - participants
      title: CreateConversationRequest
      description: Cuerpo de la solicitud para crear una conversación.
