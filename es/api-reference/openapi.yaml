    CreatePipelineRecordBody:
      properties:
        contact:
          $ref: '#/components/schemas/RecordContactRequest'
          title: Contact
          description: El contacto al que pertenece el registro, indicado con exactamente
            uno de `id`, `phone` o `email`.
        pipelineId:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Pipeline Identifier
          description: Pipeline en el que se crea el registro. Por defecto, el pipeline
            predeterminado del workspace.
          examples:
          - 5d0b8f8e-3c1a-4a4e-9a57-2f6f3e1c9b10
        stageId:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Stage Identifier
          description: Etapa en la que empieza el registro. Por defecto, la etapa
            inicial del pipeline; se rechaza una etapa final. Se aplican los requisitos
            de la etapa, como un contacto completo.
          examples:
          - stage-new
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Nombre del registro, de hasta 200 caracteres. Si falta o está
            vacío, se usa el nombre completo del contacto, luego su celular y luego
            su correo electrónico.
          examples:
          - Acme renewal 2027
        externalId:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: External Identifier
          description: Id del registro en tu sistema, único por pipeline. Un segundo
            registro con el mismo `externalId` en el mismo pipeline se rechaza con
            409 y el id del registro existente.
          examples:
          - ERP-OPP-981
        values:
          additionalProperties: true
          type: object
          title: Values
          description: Valores de los atributos del registro, indexados por id de
            atributo. Solo se aceptan atributos de alcance `RECORD` de la versión
            actual del pipeline, cada uno validado según su tipo (`TEXT` hasta 2000
            caracteres); un valor `null`, un texto vacío y una lista vacía se omiten.
          examples:
          - budget: 15000000
            closeDate: '2026-12-15'
            segment: Retail
      additionalProperties: false
      type: object
      required:
      - contact
      title: CreatePipelineRecordBody
      description: Cuerpo de la solicitud para crear un registro de pipeline.
