  /bridge/api/v1/workspaces/{workspaceId}/agents/{agentId}/outbound:
    post:
      tags:
        - Agents API
      summary: Iniciar conversación saliente con un Contact como Agent específico
      description: >-
        Inicia una conversación saliente con un Contact conocido, atendida por
        el Agent indicado.


        Funciona con Agents LeadScout y Service. Primero se resuelve el Contact
        y después el Agent, que debe existir en el workspace y estar disponible
        (consulta `GET /agents`). La plantilla se referencia mediante
        `template.id` o `template.name` (id tiene prioridad si se envían ambos),
        debe existir y estar APPROVED, y cualquier Bridge User de
        `handoffOverride` debe ser válido. Si `template.media.mediaId` es
        desconocido, la solicitud falla con 400 `BRIDGE_AI_LEADSCOUT_0016` solo
        después de crear o recuperar la conversación, por lo que un reintento
        tras ese error puede responder de otra manera. Las reglas del cuerpo
        (`consent.status=GRANTED` sin `capturedAt`, o `template.media` sin
        exactamente uno de `mediaId` o `url`) fallan con 400 `BRIDGE_CORE_0103`.


        La conversación se abre en una de las líneas activas de WhatsApp del
        Agent, bajo su control, con la plantilla como primer mensaje. Se elige
        una línea en este orden:

        - Una línea libre.

        - En su defecto, una línea con una conversación liberada recuperable con
        este Contact. La recuperación devuelve `recovered=true` y reemplaza el
        contexto saliente anterior y `agentContext`. Esto ocurre incluso con
        `forceSend=false`.

        - Si ninguna línea está libre o es recuperable: `forceSend=false`
        (predeterminado) falla con 409 `BRIDGE_AI_LEADSCOUT_0008`;
        `forceSend=true` reutiliza una línea ocupada por una conversación activa
        con este Contact, dando preferencia a una que controle este Agent. Si la
        conversación elegida está controlada por otro Agent o un Bridge User, la
        llamada falla con 409 `BRIDGE_AI_AGENT_OUTBOUND_0006` y no se escribe
        nada. Libérala primero y reintenta después. Nunca se usan líneas cuya
        conversación esté bloqueada o se haya liberado sin recuperación, por lo
        que, si ninguna línea está ocupada por una conversación activa, la
        llamada falla con 409 `BRIDGE_AI_LEADSCOUT_0008` incluso con
        `forceSend=true`.


        `contact.providerChannelId` es una preferencia: la línea indicada se usa
        cuando está libre o es recuperable; de lo contrario, se aplica el mismo
        orden entre todas las líneas del Agent. Entre las líneas ocupadas, tiene
        prioridad una que controle este Agent; si no existe, se reutiliza la
        línea indicada (y puede fallar con 0006).


        La reutilización de una conversación depende del tipo de Agent:

        - LeadScout: si su sesión de LeadScout sigue abierta y no ha vencido, la
        llamada falla con 409 `BRIDGE_AI_LEADSCOUT_0017` (`extra` incluye
        `conversationId`, `sessionId` y `stage`). Si no se puede finalizar una
        sesión vencida, falla con 409 `BRIDGE_AI_LEADSCOUT_0018`.

        - Service Agent: se continúa una sesión de servicio abierta que no haya
        vencido; una sesión vencida se cierra como abandonada y se abre una
        nueva.


        Consulta [la guía completa de envío saliente](/es/guides/agent-outbound)
        para los requisitos, la tabla de decisión de forceSend, la recuperación,
        el trabajo parcial y las decisiones de reintento seguro.
      operationId: start_agent_outbound_bridge_api_v1_workspaces__workspaceId__agents__agentId__outbound_post
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único del workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único del workspace (UUID v4).
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único del Agent (UUID v4), según `GET /agents`.
            examples:
              - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
            title: Agentid
          description: Identificador único del Agent (UUID v4), según `GET /agents`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentOutboundRequest"
              description: >-
                Cuerpo de la solicitud para iniciar una conversación saliente
                atendida por un Agent específico.
      responses:
        "201":
          description: Respuesta satisfactoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOutboundResponse"
        "400":
          description: Solicitud incorrecta
          content:
            application/json:
              examples:
                BAD_REQUEST:
                  value:
                    title: Bad Request
                    status: 400
                    code: BRIDGE_CORE_0103
                OUTBOUND_VALIDATION_ERROR:
                  value:
                    title: Outbound Validation Error
                    status: 400
                    code: BRIDGE_AI_LEADSCOUT_0016
                TEMPLATE_ORDERED_PARAMS_MISMATCH:
                  value:
                    title: Template Params Mismatch
                    status: 400
                    code: BRIDGE_AI_LEADSCOUT_0006
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Acceso prohibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No encontrado
          content:
            application/json:
              examples:
                AGENT_NOT_FOUND:
                  value:
                    title: Agent Not Found
                    status: 404
                    code: BRIDGE_AI_AGENT_OUTBOUND_0001
                NO_CHANNELS_FOR_AGENT:
                  value:
                    title: No Channels For Agent
                    status: 404
