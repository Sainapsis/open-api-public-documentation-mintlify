        \ una página puede tener menos\n  registros que `limit`, o ninguno, mientras\
        \ aún siga un `cursor`: sigue leyendo hasta que `cursor` sea null.\n- Solo\
        \ `pipelineId`: los registros de ese pipeline, opcionalmente acotados a un\
        \ `stageId`.\n\nCualquier otra combinación falla con 422."
