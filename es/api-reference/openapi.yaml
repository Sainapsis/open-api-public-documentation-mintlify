  /bridge/api/v1/workspaces/{workspaceId}/leadscout/outbound:
    post:
      tags:
        - LeadScout API
      summary: Iniciar conversación saliente de LeadScout con un lead conocido
      description: >-
        Inicia una conversación saliente de LeadScout con un Contact conocido.
        El Contact debe existir previamente. Bridge selecciona un Agent de
        prospección para una línea de WhatsApp apta. La plantilla se referencia
        mediante template.id o template.name; id tiene prioridad si se
        proporcionan ambos. Debe existir y estar APPROVED, y cualquier Bridge
        User de handoffOverride debe ser válido.


        Se respeta un contact.providerChannelId explícito. Sin él, la selección
        automática prefiere una línea libre, después una conversación liberada
        recuperable con este Contact y, por último, una conversación activa
        ocupada solo cuando forceSend=true. La disponibilidad se evalúa por
        Contact en cada línea, no por la ocupación global de la línea.


        forceSend=true reutiliza una conversación activa apta; no la ignora ni
        crea una nueva. Una reutilización exitosa devuelve alreadyInitiated=true
        y persiste la nueva plantilla y los seguimientos. Una conversación
        liberada recuperable se puede recuperar con cualquiera de los dos
        valores, conserva su ID y devuelve recovered=true. Esta opción no
        habilita las conversaciones bloqueadas ni las liberadas no recuperables.
        La ruta heredada puede reutilizar una conversación controlada por un
        humano u otro Agent; a diferencia del envío saliente de Agents, no exige
        la comprobación de control por el Agent solicitado.


        Una sesión abierta de LeadScout que no haya vencido sigue bloqueando una
        nueva solicitud saliente con 409 BRIDGE_AI_LEADSCOUT_0017; si no se
        puede finalizar una sesión vencida, devuelve 409
        BRIDGE_AI_LEADSCOUT_0018. Las demás validaciones siguen vigentes. Los
        mensajes adicionales se persisten; persistirlos no demuestra su entrega
        ni que se espere la respuesta del lead. Una solicitud fallida puede
        dejar trabajo parcial, por lo que no debes tratar forceSend como
        idempotencia ni reintentar a ciegas un resultado incierto.


        Consulta [la guía completa de envío saliente](/es/guides/agent-outbound)
        para la matriz false/true, los indicadores de respuesta, las diferencias
        con el envío saliente de Agents, los errores y la transferencia.
      operationId: initiate_leadscout_outbound_bridge_api_v1_workspaces__workspaceId__leadscout_outbound_post
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único del workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único del workspace (UUID v4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadscoutOutboundRequest"
              description: Cuerpo de la solicitud para iniciar una conversación saliente de
                LeadScout.
      responses:
        "201":
          description: Respuesta satisfactoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadscoutOutboundResponse"
        "400":
          description: Solicitud incorrecta
          content:
            application/json:
              examples:
                OUTBOUND_VALIDATION_ERROR:
                  value:
                    title: Outbound Validation Error
                    status: 400
                    code: BRIDGE_AI_LEADSCOUT_0016
                TEMPLATE_ORDERED_PARAMS_MISMATCH:
                  value:
                    title: Template Params Mismatch
                    status: 400
                    code: BRIDGE_AI_LEADSCOUT_0006
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No encontrado
          content:
            application/json:
              examples:
                EXTERNAL_USER_NOT_FOUND:
                  value:
                    title: External User Not Found
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0001
                INTERNAL_USER_NOT_FOUND:
                  value:
                    title: Internal User Not Found
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0002
                TEMPLATE_NOT_FOUND:
                  value:
                    title: Template Not Found
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0004
                NO_CHANNELS_FOR_BRAND:
                  value:
                    title: No Channels For Brand
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0009
                PROVIDER_CHANNEL_NOT_IN_WORKSPACE:
                  value:
                    title: Channel Not In Workspace
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0010
                WORKSPACE_HAS_NO_PROVIDER_CHANNELS:
                  value:
                    title: No Provider Channels
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0011
                NO_PROSPECTING_AGENT_FOR_CHANNEL:
                  value:
                    title: No Agent For Channel
                    status: 404
                    code: BRIDGE_AI_LEADSCOUT_0012
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflicto
          content:
            application/json:
              examples:
                INTERNAL_USER_DELETED:
                  value:
                    title: Internal User Deleted
                    status: 409
                    code: BRIDGE_AI_LEADSCOUT_0003
                TEMPLATE_NOT_APPROVED:
                  value:
