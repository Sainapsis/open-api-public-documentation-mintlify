  /bridge/api/v1/workspaces/{workspaceId}/contacts/lookup:
    get:
      tags:
        - Contacts API
      summary: Obtener contacto por un identificador
      description: >-
        Obtiene un contacto específico por cualquiera de sus identificadores
        dentro del workspace.


        `type=ID` devuelve el mismo contacto que GET /contacts/{contactId}, la
        URL canónica de un contacto y la opción preferida cuando ya tienes su
        ID.
      operationId: retrieve_contact_by_identifier_bridge_api_v1_workspaces__workspaceId__contacts_lookup_get
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único del workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único del workspace (UUID v4).
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ParticipantIdentifierType"
            description: Tipo de identificador con el que se proporciona el valor.
          description: Tipo de identificador con el que se proporciona el valor.
        - name: value
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 320
            description: >-
              El identificador, en el formato indicado por `type`. Un `PHONE` se
              interpreta como el celular al escribir un contacto: si no incluye
              código de país, se usa el país predeterminado del workspace y se
              ignoran espacios y separadores. En un `EMAIL`, el dominio pasa a
              minúsculas, pero la parte local debe coincidir exactamente con lo
              enviado.
            title: Value
          description: >-
            El identificador, en el formato indicado por `type`. Un `PHONE` se
            interpreta como el celular al escribir un contacto: si no incluye
            código de país, se usa el país predeterminado del workspace y se
            ignoran espacios y separadores. En un `EMAIL`, el dominio pasa a
            minúsculas, pero la parte local debe coincidir exactamente con lo
            enviado.
          examples:
            cellphone:
              summary: A cellphone
              description: >-
                Send with `type=PHONE`. A value that cannot be read as a
                cellphone is refused before any lookup happens.
              value: "+14084029292"
            email:
              summary: An email address
              description: >-
                Send with `type=EMAIL`. `John.Doe@example.com` and
                `john.doe@example.com` are different identifiers and do not
                resolve to the same contact.
              value: john.doe@example.com
            id:
              summary: The contact id
              description: >-
                Send with `type=ID`. Returns exactly what `GET
                /contacts/{contactId}` returns, which stays the canonical URL
                for a contact.
              value: 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
