  /bridge/api/v1/workspaces/{workspaceId}/templates/{templateId}:
    get:
      tags:
        - Templates API
      summary: Descubrir las variables agnósticas de una plantilla
      description: >-
        Devuelve las variables de una plantilla:
        `key`/`label`/`callerMustSupply`/`isCustom`/`default`, independientes de
        la ubicación en Meta.


        Nunca devuelve la dirección o el índice de una posición de Meta.


        `templateId` acepta el `id` o el `name` de la plantilla. Las operaciones
        salientes aceptan `template.id` o `template.name`, con prioridad para un
        id no vacío. El inicio de conversaciones utiliza
        `onboardingTemplates[].templateId`. Utiliza el selector que exige la
        operación de envío. Consulta [la receta de
        plantillas](/es/guides/send-template).


        Una variable con `callerMustSupply: true` no tiene una fuente declarada:
        quien llama debe incluir su `key` en `parameters` al enviar; de lo
        contrario, el envío falla con un 422 que identifica ese mismo `key`.

        Una variable con `callerMustSupply: false` la resuelve Bridge por su
        cuenta, por ejemplo, el nombre del destinatario, o ya tiene un valor que
        quien llama puede sobrescribir opcionalmente.

        Una variable con `isCustom: true` es un valor que solo conoce quien
        llama y tiene un `default`: envíala en `parameters` para usar tu propio
        valor, u omítela o déjala en blanco para enviar `default`.


        Códigos de error:

        - BRIDGE_CORE_0301: el workspace de la ruta no coincide con el workspace
        de quien llama (403)

        - BRIDGE_TEMPLATE_0001: no se encontró una PROVIDER_TEMPLATE para este
        workspace e identificador. Incluye por igual un id/name desconocido, una
        plantilla de otro workspace y una plantilla que no es PROVIDER_TEMPLATE
        (404); este endpoint nunca confirma la existencia de una plantilla fuera
        del workspace de quien llama
      operationId: get_template_discovery_bridge_api_v1_workspaces__workspaceId__templates__templateId__get
      security:
        - x-api-key: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único del workspace (UUID v4).
            examples:
              - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            title: Workspaceid
          description: Identificador único del workspace (UUID v4).
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            description: "ID o nombre de la plantilla: ambos identifican la misma
              plantilla."
            examples:
              - order_shipped_promo
              - f0000040-0000-4000-8000-000000000040
            title: Templateid
          description: "ID o nombre de la plantilla: ambos identifican la misma plantilla."
      responses:
        "200":
          description: Respuesta satisfactoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDiscoveryResponse"
        "403":
          description: Acceso prohibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
