      - Pipeline Records API
      summary: Mover un registro de pipeline a otra etapa
      description: 'Mueve un registro abierto a otra etapa de la versión del pipeline
        que sigue; una etapa final lo cierra.


        Una etapa que no está en esa versión, como una de otro pipeline, falla con
        422 `BRIDGE_PIPELINE_0311`

        (`errRecordStage`), y la etapa en la que el registro ya está, con 409 `BRIDGE_PIPELINE_0004`.
        Un registro cerrado

        falla con 409 `BRIDGE_PIPELINE_0306`: reábrelo primero. Cuando la etapa exige
        un contacto completo, uno

        incompleto falla con 422 `BRIDGE_PIPELINE_0305`. Un movimiento a una etapa
        final puede llevar un `reasonId` activo

        del pipeline (422 `BRIDGE_PIPELINE_0315` cuando no existe, `BRIDGE_PIPELINE_0314`
        cuando está retirado)

        y un `reasonNote`; sin uno, el registro se cierra sin motivo. Un motivo o
        una nota en un movimiento a una etapa

        abierta falla con 422 `BRIDGE_PIPELINE_0311`. Con `expectedRevision`, un registro
        modificado desde que lo leíste falla

        con 409 `BRIDGE_PIPELINE_0101`, cuyo `extra.currentRecord` es el registro
        tal como está ahora.


        `Idempotency-Key` es obligatorio y funciona como en `POST /records`: un reintento
        con la misma clave y el mismo cuerpo responde

        con el registro y `Idempotent-Replayed: true`, tal como está ahora. La misma
        clave en otro registro u operación falla con

        422 `BRIDGE_PIPELINE_0402`.'
      operationId: move_pipeline_record_bridge_api_v1_workspaces__workspaceId__records__recordId__move_post
      security:
      - x-api-key: []
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Identificador único del workspace (UUID v4).
          examples:
          - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
          title: Workspaceid
        description: Identificador único del workspace (UUID v4).
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: Identificador único del registro de pipeline.
          examples:
          - 0d3c7f0e-5a43-5c0e-9f53-1f6a4b2e7d11
          title: Recordid
        description: Identificador único del registro de pipeline.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Una clave que eliges por cada cambio, como el id de operación
            de tu sistema. Envía la misma clave cuando reintentes la solicitud: durante
            24 horas responde con el registro que cambió la primera solicitud.'
          examples:
          - erp-opp-981-won
          title: Idempotency-Key
        description: 'Una clave que eliges por cada cambio, como el id de operación
          de tu sistema. Envía la misma clave cuando reintentes la solicitud: durante
          24 horas responde con el registro que cambió la primera solicitud.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovePipelineRecordBody'
              description: Cuerpo de la solicitud para mover un registro de pipeline
                a otra etapa de su pipeline.
      responses:
        '200':
          description: El registro tal como queda después del cambio, o después de
            una solicitud anterior con la misma clave.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRecordResponse'
          headers:
            Idempotent-Replayed:
              description: '`true` cuando el cambio lo hizo una solicitud anterior
                con la misma clave.'
              schema:
                type: string
                enum:
                - 'true'
        '429':
          description: Demasiadas solicitudes
          content:
            application/json:
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Contenido no procesable
          content:
            application/json:
              examples:
                INVALID_FIELD_FORMAT:
                  value:
                    title: Invalid Field Format
                    status: 422
                    code: BRIDGE_CORE_0101
                CONTACT_INCOMPLETE:
                  value:
                    title: Contact Incomplete
                    status: 422
                    code: BRIDGE_PIPELINE_0305
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    title: Idempotency Key Reused
                    status: 422
                    code: BRIDGE_PIPELINE_0402
                PIPELINE_RECORD_VALIDATION_FAILED:
                  value:
                    title: Pipeline Record Validation Failed
                    status: 422
                    code: BRIDGE_PIPELINE_0311
                CLOSE_REASON_RETIRED:
                  value:
                    title: Close Reason Retired
                    status: 422
                    code: BRIDGE_PIPELINE_0314
                CLOSE_REASON_NOT_FOUND:
                  value:
                    title: Close Reason Not Found
                    status: 422
                    code: BRIDGE_PIPELINE_0315
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Acceso prohibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
                PIPELINES_DISABLED:
                  value:
                    title: Pipelines Disabled
                    status: 403
                    code: BRIDGE_PIPELINE_0301
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No encontrado
