    LeadscoutOutboundContactRef:
      properties:
        identifier:
          type: string
          title: Identifier
          description: >-
            Identificador del Contact según identifierType: ID de Contact para
            ID, correo electrónico para EMAIL o teléfono en formato E.164 para
            PHONE. El Contact ya debe existir en el workspace.
          examples:
            - "+573001234567"
        identifierType:
          $ref: "#/components/schemas/ParticipantIdentifierType"
          title: Identifier Type
          description: Tipo de identificador.
          examples:
            - PHONE
            - EMAIL
            - ID
        messageProviderType:
          $ref: "#/components/schemas/MessageProviderType"
          title: Message Provider Type
          description: Proveedor utilizado para entregar la plantilla.
          examples:
            - WHATSAPP
        providerChannelId:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Channel Identifier
          description: >-
            ID opcional de línea explícita de WhatsApp. Si se proporciona, se
            usa esa línea, que debe pertenecer al workspace y resolver a un
            Agent de prospección. Si se omite, las líneas elegibles se
            seleccionan automáticamente: primero las libres, después las
            liberadas recuperables y, solo con forceSend=true, las ocupadas. Si
            se indica brandId, se limitan los candidatos a esa marca. El ID de
            línea no es un número telefónico. Consulta
            [identificadores](/es/guides/identifiers) y [selección
            saliente](/es/guides/agent-outbound).
          examples:
            - c4f2a1e0-9b8d-4e7c-a6f5-1d2e3f4a5b6c
            - null
      type: object
      required:
        - identifier
        - identifierType
        - messageProviderType
      title: LeadscoutOutboundContactRef
      description: Identifica al lead al que se dirigirá la conversación saliente.
    LeadscoutOutboundHandoffOverride:
      properties:
        preAssignedUser:
          $ref: "#/components/schemas/LeadscoutOutboundPreAssignedUser"
          title: Pre-assigned User
          description: >-
            Usuario interno que se asignará como asesor cuando la IA transfiera
            la conversación. Se valida durante la solicitud: si el usuario no
            existe, está inactivo o pertenece a otro workspace, se rechaza antes
            de crear una conversación.
          examples:
            - identifier: advisor@acme.com
              identifierType: EMAIL
      additionalProperties: false
      type: object
      required:
        - preAssignedUser
      title: LeadscoutOutboundHandoffOverride
      description: Reemplaza la asignación predeterminada del asesor de la
        conversación saliente.
    LeadscoutOutboundPreAssignedUser:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Valor que identifica al usuario interno, interpretado según
            identifier_type.
          examples:
            - advisor@acme.com
            - usr_01HZ2K3J4M5N6P7Q8R9S0T1UV2
        identifierType:
          $ref: "#/components/schemas/InternalParticipantIdentifierType"
          title: Identifier Type
          description: >-
            Cómo resolver el identificador. ID busca por ID de usuario interno;
            EMAIL busca por correo electrónico.
          examples:
            - EMAIL
            - ID
      additionalProperties: false
      type: object
      required:
        - identifier
        - identifierType
      title: LeadscoutOutboundPreAssignedUser
      description: Identifica al usuario interno que debe recibir la transferencia.
    LeadscoutOutboundRequest:
      properties:
        contact:
          $ref: "#/components/schemas/LeadscoutOutboundContactRef"
          title: Contact
          description: Lead al que se dirige esta conversación saliente. Ya debe existir
            en el workspace.
        template:
          $ref: "#/components/schemas/LeadscoutOutboundTemplateRef"
          title: Template
          description: Plantilla inicial que se enviará.
        additionalMessages:
          items:
            $ref: "#/components/schemas/OutboundFollowUpRequest"
          type: array
          maxItems: 5
          title: Additional Messages
          description: >-
            Hasta cinco mensajes de seguimiento guardados en la conversación en
            el orden de la solicitud. La persistencia no confirma la entrega. No
            asumas que estos mensajes esperan la respuesta del lead; consulta la
            guía de outbound para considerar entrega y reintentos.
        agentContext:
          anyOf:
            - $ref: "#/components/schemas/OutboundAgentContextRequest"
            - type: "null"
          title: Agent Context
          description: Notas y medios opcionales guardados en la conversación como
            contexto para el agente.
        consent:
          anyOf:
            - $ref: "#/components/schemas/OutboundConsentRequest"
            - type: "null"
          title: Consent
          description: >-
            Evidencia opcional de consentimiento, declarada por la empresa, que
            se registra en la conversación.
        handoffOverride:
          anyOf:
            - $ref: "#/components/schemas/LeadscoutOutboundHandoffOverride"
            - type: "null"
          title: Handoff Override
          description: >-
            Opción para preasignar un usuario interno específico como asesor de
            la transferencia. Se valida durante la solicitud; si falla, se
            cancela la creación de la conversación.
        brandId:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Identifier
          description: >-
            ID opcional de marca. Si se proporciona, solo son elegibles los
            canales vinculados a ella. Omítelo para considerar todos los canales
            del workspace.
          examples:
            - null
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
        campaignId:
          anyOf:
            - type: string
            - type: "null"
          title: Campaign Identifier
          description: Referencia opcional de campaña guardada en la conversación para
            auditoría e informes.
          examples:
            - null
            - spring_promo_2026
        forceSend:
          type: boolean
          title: Force Send
          description: >-
            Controla la reutilización de una conversación activa existente con
            este Contact en la línea elegida. Con false (predeterminado), una
            línea ocupada seleccionada explícitamente devuelve 409
            BRIDGE_AI_LEADSCOUT_0007; la selección automática con solo líneas
            ocupadas devuelve 409 BRIDGE_AI_LEADSCOUT_0008. Con true, se
            reutiliza una conversación ocupada apta en lugar de crear una nueva,
            y una reutilización exitosa establece alreadyInitiated=true. La
            selección automática prefiere una línea libre, después una
            conversación liberada recuperable y, por último, una conversación
            ocupada cuando true. La recuperación es posible con cualquiera de
            los dos valores y devuelve recovered=true. La ruta heredada de
            LeadScout puede reutilizar una conversación controlada por un
            humano; no aplica la comprobación de control del envío saliente de
            Agents. Esta opción no omite las conversaciones bloqueadas/no
            recuperables, las comprobaciones de sesión ni otras validaciones y
            no es una clave de idempotencia. Consulta [Envío saliente de Agents
            y forceSend](/es/guides/agent-outbound).
          default: false
          examples:
            - false
            - true
      type: object
      required:
        - contact
        - template
      title: LeadscoutOutboundRequest
      description: Cuerpo de la solicitud para iniciar una conversación saliente de
        LeadScout.
    LeadscoutOutboundResponse:
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationResponse"
          title: Conversation
          description: >-
            Conversación utilizada para esta solicitud saliente: nueva,
            reutilizada (alreadyInitiated=true) o recuperada (recovered=true).
            Una conversación reutilizada conserva su ID; la reutilización
            legacy, por sí sola, no implica que haya cambiado su controlador.
        contact:
          $ref: "#/components/schemas/ContactResponse"
          title: Contact
          description: Contacto con el que se inició la conversación.
        templateSent:
          anyOf:
            - $ref: "#/components/schemas/LeadscoutTemplateSent"
            - type: "null"
          title: Template Sent
          description: Resumen de la plantilla despachada.
        additionalMessagesPersisted:
          type: integer
          title: Additional Messages Persisted
          description: Número de mensajes de seguimiento guardados en la conversación.
          default: 0
          examples:
            - 0
            - 3
        alreadyInitiated:
          type: boolean
          title: Already Initiated
          description: >-
            True cuando esta solicitud satisfactoria reutilizó una conversación
            activa existente mediante forceSend=true. False para creación o
            recuperación; consulta recovered para distinguir esas rutas. Es
            informativo: una reutilización satisfactoria también guarda la nueva
            plantilla y los seguimientos, por lo que repetir la solicitud puede
            agregar mensajes.
          default: false
          examples:
            - false
            - true
        recovered:
          type: boolean
          title: Recovered
          description: >-
            True cuando esta solicitud recuperó una conversación liberada que el
            contacto tenía en el canal elegido, en lugar de crear otra.
          default: false
          examples:
            - false
            - true
      type: object
      required:
        - conversation
        - contact
      title: LeadscoutOutboundResponse
      description: Cuerpo de respuesta de un inicio saliente de LeadScout satisfactorio.
    LeadscoutOutboundTemplateRef:
      properties:
        id:
          anyOf:
            - type: string
            - type: "null"
          title: Template Identifier
          description: ID de la plantilla registrada (de GET /templates). Si se envían id
            y name, se usa id.
          examples:
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
            - null
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Template Name
          description: >-
            Nombre de la plantilla registrada y aprobada por Meta que se
            enviará. Obligatorio si no se envía id; se ignora si se envía id.
          examples:
            - leadscout_outbound_fb_v1
            - null
        orderedParams:
          items:
            type: string
          type: array
          title: Ordered Parameters
          description: >-
            Valores proporcionados por el cliente para los slots de parámetros
            de la plantilla con origen CALLER, en orden de posición.
          examples:
            - - Maria
              - ACME
        parameters:
          additionalProperties:
            type: string
          type: object
          title: Parameters
          description: >-
            Valores proporcionados por el cliente e indexados por la clave de
            variable de la plantilla (consulta GET /templates/{id} para obtener
            las claves), tanto para el cuerpo como para los botones. Prefiere
            esta opción a orderedParams si la plantilla tiene un botón dinámico.
            Se rechaza con 422 una clave desconocida o que se superponga con un
            slot ya cubierto por orderedParams.
          examples:
            - recipient_first_name: Maria
              tracking_code: TRK123
        media:
          anyOf:
            - $ref: "#/components/schemas/OutboundTemplateMedia"
            - type: "null"
          title: Header Media
          description: >-
            Medio opcional de encabezado (imagen o video) que se adjuntará al
            mensaje de plantilla. Acepta un mediaId precargado o una url
            pública.
      type: object
      title: LeadscoutOutboundTemplateRef
      description: Referencia la plantilla aprobada por Meta que abrirá la conversación.
    LeadscoutTemplateSent:
      properties:
        id:
          anyOf:
            - type: string
            - type: "null"
          title: Template Identifier
          description: ID de la plantilla enviada.
          examples:
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
        name:
          type: string
          title: Template Name
          description: Nombre de la plantilla despachada.
          examples:
            - leadscout_outbound_fb_v1
        messageId:
          anyOf:
            - type: string
            - type: "null"
          title: Message Identifier
          description: >-
            wamid de Meta de la plantilla despachada. Es null en el flujo
            satisfactorio hasta que el proceso de envío devuelva el wamid a la
            API de entrada.
          examples:
            - null
            - wamid.HBgM...
      type: object
      required:
        - name
      title: LeadscoutTemplateSent
      description: Resumen de la plantilla despachada para abrir la conversación.
    MessageProviderType:
      type: string
      enum:
        - WHATSAPP
        - SMS
        - TELEGRAM
        - INSTAGRAM
        - TWITTER
        - LINE
        - FACEBOOK
        - IMESSAGE
        - WHATSAPP_TEST
        - HEYGIA
      title: MessageProviderType
    MessageRequest:
      properties:
        conversationId:
          type: string
          title: Conversation Identifier
          description: Identificador de la conversación.
          examples:
            - d290f1ee-6c54-4b01-90e6-d701748f0851
        messageBody:
          type: string
          title: Message Body
          description: Cuerpo del mensaje.
          examples:
            - Hello, welcome to Bridge!
        replyToMessageId:
          anyOf:
            - type: string
            - type: "null"
          title: Reply To Message Identifier
          description: Identificador del mensaje al que se responde.
          examples:
            - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
            - null
        enableExternalBroadcast:
          type: boolean
          title: Enable External Broadcast
          description: >-
            Controla si un mensaje aceptado es elegible para entrega externa.
            Con false, el mensaje se crea, pero se omite el broadcast externo.
            Con true, entra en el flujo normal de entrega externa cuando las
            reglas de la conversación y del destinatario lo permiten. Una
            respuesta de creación satisfactoria y messageId no son comprobantes
            de entrega. Este indicador no concede visibilidad ni omite permisos.
            Tampoco desactiva las plantillas de onboarding iniciadas por una
            solicitud separada de creación de conversación.
          examples:
            - true
            - false
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: Lista de IDs de medios asociados al mensaje.
          examples:
            - - a1b2c3d4-e5f6-7g8h-9i0j-k1l2m3n4o5p6
      type: object
      required:
        - conversationId
        - messageBody
        - enableExternalBroadcast
      title: MessageRequest
      description: Cuerpo de la solicitud para crear un mensaje en una conversación
        específica.
    MessageResponse:
      properties:
        messagingProduct:
          type: string
          title: Messaging Product
          description: Nombre del producto.
          default: bridge
          examples:
            - bridge
        messageId:
          type: string
          title: Message Identifier
          description: Identificador único del mensaje como cadena UUID.
          examples:
            - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
      type: object
      required:
        - messageId
      title: MessageResponse
      description: Cuerpo de respuesta para operaciones con mensajes.
    MovePipelineRecordBody:
      properties:
        expectedRevision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Revision
          description: La `revision` del registro que leíste por última vez. Cuando
            ya no es la actual, el cambio falla con 409 `BRIDGE_PIPELINE_0101` y el
            registro actual en `extra.currentRecord`. Sin ella, el cambio se aplica
            al registro tal como lo lee la solicitud, por lo que otro cambio hecho
            en el mismo instante aún puede hacerla fallar con ese 409.
          examples:
          - 3
        stageId:
          type: string
          maxLength: 255
          minLength: 1
          title: Stage Identifier
          description: Etapa a la que se mueve el registro, de la versión del pipeline
            que el registro sigue. Una etapa final cierra el registro. Se aplican
            los requisitos de la etapa, como un contacto completo.
          examples:
          - stage-won
        reasonId:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Close Reason Identifier
          description: Motivo de cierre activo del pipeline, según `GET /pipelines/{pipelineId}`.
            Solo para un movimiento a una etapa final, y opcional en ese caso.
          examples:
          - reason-price
        reasonNote:
          anyOf:
          - type: string
          - type: 'null'
          title: Close Reason Note
          description: Texto libre que explica el motivo de cierre, de hasta 500 caracteres.
            Requiere `reasonId`.
          examples:
          - Chose a cheaper provider
      additionalProperties: false
      type: object
      required:
      - stageId
      title: MovePipelineRecordBody
      description: Cuerpo de la solicitud para mover un registro de pipeline a otra
        etapa de su pipeline.
    OnboardingTemplateRequest:
      properties:
        templateId:
          type: string
          title: Template Identifier
          description: Identificador de la plantilla del sistema que se enviará.
          examples:
            - 4061e74e-f6fe-4072-a760-3aec0b64f7a6
        parameters:
          additionalProperties:
            type: string
            maxLength: 1024
          propertyNames:
            maxLength: 128
          type: object
          maxProperties: 50
          title: Template Parameters
          description: >-
            Valores de las variables de esta plantilla, indexados por el `key`
            de la variable devuelto por `GET /templates/{templateId}`. Las
            variables marcadas con `callerMustSupply: true` son obligatorias:
            Bridge no tiene otra fuente para ellas. Las demás son opcionales; un
            valor enviado para una de ellas, como el nombre del Contact,
            reemplaza el valor por Contact y se utiliza para todos los Contacts
            de la conversación. Solo las plantillas de proveedor de WhatsApp
            aceptan parámetros. Si falta un valor obligatorio o está en blanco,
            una clave no corresponde a ninguna variable de la plantilla o la
            plantilla no admite parámetros, la solicitud se rechaza con 422 y no
            se crea ninguna conversación: `BRIDGE_CONVERSATION_0604` enumera las
            variables que faltan en `extra.missingVariables` como `[{key,
            label}]`, `0605` enumera las claves desconocidas en
            `extra.unknownKeys` y `0606` identifica la plantilla en
            `extra.templateId`. Los valores también deben cumplir las reglas de
            WhatsApp: sin saltos de línea ni tabulaciones, no más de cuatro
            espacios consecutivos, el encabezado con tu valor dentro de 60
            caracteres, el enlace de un botón URL con tu valor dentro de 2.000 y
            el texto del cuerpo más tus valores dentro de 1.024. Bridge rechaza
            los valores que puede detectar que incumplen estas reglas con
            `BRIDGE_CONVERSATION_0607`, identificando la plantilla en
            `extra.templateId` y enumerando cada valor inválido en
            `extra.invalidVariables` como `[{key, label, reason}]`. `reason` es
            la primera regla que incumple el valor: `NEWLINE`, `TAB`,
            `CONSECUTIVE_SPACES`, `TOO_LONG` (encabezado o botón URL) o
            `BODY_TOO_LONG` (el cuerpo supera el límite, por lo que se enumeran
            todos los valores del cuerpo que enviaste). Los valores que Bridge
            rellena después, como el nombre del Contact, también cuentan para el
            límite del cuerpo, así que deja espacio para ellos. Como máximo, 50
            parámetros por plantilla, con claves de hasta 128 caracteres y cada
            valor de hasta 1.024.
          examples:
            - delivery_date: 3 de octubre
              order_number: A-10492
      additionalProperties: false
      type: object
      required:
        - templateId
      title: OnboardingTemplateRequest
      description: Entrada del reemplazo de onboarding; su posición en la lista
        determina el orden.
    OpenAttributeRequest:
      properties:
        customAttributeId:
          type: string
          title: Custom Attribute Identifier
          description: Identificador único del atributo personalizado abierto.
          examples:
            - 651c97c1-b31d-466f-825c-fe77b39e7ae6
        content:
          type: string
          title: Content
          description: Valor del atributo abierto.
      type: object
      required:
        - customAttributeId
        - content
      title: OpenAttributeRequest
      description: Cuerpo de la solicitud para operaciones de atributos personalizados
        abiertos.
    OutboundAgentContextRequest:
      properties:
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Notes
          description: Notas de texto libre para el agente, limitadas a 2000 caracteres.
          examples:
            - Lead asked about pricing tiers last week.
            - null
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: >-
            Identificadores opcionales de archivos precargados guardados en la
            conversación como contexto del agente.
          examples:
            - []
            - - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
      type: object
      title: OutboundAgentContextRequest
      description: >-
        Notas y medios guardados en la conversación como contexto del agente
        para la revisión por IA o una persona.
    OutboundConsentRequest:
      properties:
        status:
          $ref: "#/components/schemas/ConsentStatus"
          title: Status
          description: >-
            Estado de consentimiento declarado por la empresa. Usa GRANTED (con
            capturedAt) para consentimiento explícito o NOT_PROVIDED si la
            empresa no tiene evidencia que declarar.
          examples:
            - GRANTED
            - NOT_PROVIDED
        capturedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Captured At
          description: >-
            Fecha y hora ISO8601 (con milisegundos) en que la empresa obtuvo el
            consentimiento. Obligatorio con status=GRANTED; se acepta null u
            omitido con status=NOT_PROVIDED.
          examples:
            - "2026-04-20T10:00:00.000Z"
            - null
      type: object
      required:
        - status
      title: OutboundConsentRequest
      description: >-
        Evidencia de consentimiento declarada por la empresa y registrada sin
        modificaciones en la conversación.
    OutboundFollowUpRequest:
      properties:
        messageBody:
          type: string
          title: Message Body
          description: Cuerpo de texto plano del mensaje de seguimiento.
          examples:
            - Just confirming we're still on for tomorrow at 10am.
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: >-
            El esquema de solicitud lo acepta, pero el flujo saliente compartido
            actual guarda los seguimientos solo como texto y no adjunta estos
            IDs de medios. Para medios de la plantilla inicial, usa
            template.media; para un mensaje de adjunto separado, sigue el flujo
            de adjuntos de Message.
          examples:
            - []
            - - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
      type: object
      required:
        - messageBody
      title: OutboundFollowUpRequest
      description: Mensaje de seguimiento precargado que se guarda en la conversación
        junto a la plantilla inicial.
    OutboundTemplateMedia:
      properties:
        type:
          $ref: "#/components/schemas/HeaderFileType"
          title: Media Type
          description: Tipo de medio del encabezado. Debe coincidir con el configurado
            para la plantilla en Meta.
          examples:
            - IMAGE
            - VIDEO
        mediaId:
          anyOf:
            - type: string
            - type: "null"
          title: Media Identifier
          description: >-
            UUID devuelto por POST
            /bridge/api/v1/workspaces/{workspaceId}/files. Mutuamente excluyente
            con url.
          examples:
            - null
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
        url:
          anyOf:
            - type: string
            - type: "null"
          title: Source URL
          description: >-
            URL pública de origen que obtiene de forma asíncrona el servicio de
            descarga de archivos por URL. Mutuamente excluyente con mediaId.
          examples:
            - null
            - https://cdn.example.com/promo.jpg
      type: object
      required:
        - type
      title: OutboundTemplateMedia
      description: >-
        Medio opcional de encabezado adjunto al mensaje de plantilla inicial.


        Proporciona exactamente uno: ``mediaId`` (UUID devuelto por ``POST
        /bridge/api/v1/workspaces/{workspaceId}/files``) o ``url`` (URL pública
        de origen obtenida de forma asíncrona por el servicio de descarga por
        URL).
