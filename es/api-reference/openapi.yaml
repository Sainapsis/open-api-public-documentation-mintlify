      type: object
      required:
        - url
      title: PresignPut
      description: Datos del PUT prefirmado para cargar un archivo de medios.
    Problem:
      properties:
        title:
          type: string
          title: Title
          description: Resumen breve del tipo de problema.
        status:
          type: integer
          title: Status
          description: Código de estado HTTP generado por el servidor de origen para esta
            instancia del problema.
        detail:
          anyOf:
            - type: string
            - type: "null"
          title: Detail
          description: Explicación específica de esta instancia del problema.
        instance:
          anyOf:
            - type: string
            - type: "null"
          title: Instance
          description: Referencia URI que identifica esta instancia del problema.
        traceId:
          anyOf:
            - type: string
            - type: "null"
          title: Traceid
          description: ID de seguimiento para depuración.
        code:
          anyOf:
            - type: string
            - type: "null"
          title: Code
          description: Código para identificar el error; consulta la página de códigos de
            error para más detalles.
        errors:
          anyOf:
            - items:
                additionalProperties: true
                type: object
              type: array
            - type: "null"
          title: Errors
          description: Lista de detalles de errores.
        extra:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Extra
          description: Información adicional sobre el problema.
      type: object
      required:
        - title
        - status
      title: Problem
      description: Objeto que representa el cuerpo de una respuesta Problem.
    ProviderChannel:
      properties:
        provider:
          $ref: "#/components/schemas/MessageProviderType"
          title: Provider
          description: Nombre del proveedor del canal de mensajería.
          examples:
            - WHATSAPP
            - HEYGIA
        identifier:
          type: string
          title: Identifier
          description: Identificador asociado a este canal del proveedor, en formato E.164
            sin el signo '+'.
      type: object
      required:
        - provider
        - identifier
      title: ProviderChannel
      description: Canal de proveedor asociado a un workspace.
    ProviderChannelResponse:
      properties:
        workspaceId:
          type: string
          title: Workspace Identifier
          description: Identificador único del workspace (UUID v4).
          examples:
            - 92b2d4f3-81e1-4b61-a7ec-6f4ff3b58be5
        providerChannels:
          items:
            $ref: "#/components/schemas/ProviderChannel"
          type: array
          title: Provider Channels
          description: Lista de canales de proveedores (números telefónicos) disponibles
            para este workspace.
      type: object
      required:
        - workspaceId
        - providerChannels
      title: ProviderChannelResponse
      description: Cuerpo de respuesta para operaciones con canales de proveedores.
    RecordContactResponse:
      properties:
        id:
          type: string
          title: Identifier
          description: Id del contacto. Resuélvelo con `GET /contacts/{contactId}`.
          examples:
          - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
      type: object
      required:
      - id
      title: RecordContactResponse
      description: El contacto al que pertenece un registro.
    RecordContactRequest:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Identifier
          description: Id del contacto, tal como lo devuelve la API de Contactos.
          examples:
          - 4e362e2b-67b2-4a7e-a9df-e9ecf9141be8
        phone:
          anyOf:
          - type: string
            maxLength: 320
            minLength: 1
          - type: 'null'
          title: Phone
          description: 'Celular del contacto, interpretado como lo hace `GET /contacts/lookup`:
            un número sin código de país se interpreta en el país predeterminado del
            workspace.'
          examples:
          - '+573001234567'
        email:
          anyOf:
          - type: string
            maxLength: 320
            minLength: 1
          - type: 'null'
          title: Email
          description: Correo electrónico del contacto, interpretado como lo hace
            `GET /contacts/lookup`.
          examples:
          - john.doe@example.com
      additionalProperties: false
      type: object
      title: RecordContactRequest
      description: El contacto al que pertenece el registro, indicado con exactamente
        uno de sus identificadores. El contacto nunca se crea.
    RecordCloseReasonResponse:
      properties:
        id:
          type: string
          title: Identifier
          description: Id del motivo de cierre, según `GET /pipelines/{pipelineId}`.
          examples:
          - reason-price
        label:
          type: string
          title: Label
          description: Nombre del motivo de cierre cuando se cerró el registro.
          examples:
          - Price too high
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: Texto libre escrito cuando se cerró el registro.
          examples:
          - null
      type: object
      required:
      - id
      - label
      title: RecordCloseReasonResponse
      description: El motivo con el que se cerró un registro cerrado.
    ReleaseConversationBody:
      properties:
        reason:
          anyOf:
            - type: string
            - type: "null"
          title: Reason
          description: Motivo opcional para liberar la conversación.
          examples:
            - The conversation is over
            - null
      type: object
      title: ReleaseConversationBody
      description: Cuerpo de POST para liberar una conversación. El motivo es opcional.
    ReopenPipelineRecordBody:
      properties:
        expectedRevision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Revision
          description: La `revision` del registro que leíste por última vez. Cuando
            ya no es la actual, el cambio falla con 409 `BRIDGE_PIPELINE_0101` y el
            registro actual en `extra.currentRecord`. Sin ella, el cambio se aplica
            al registro tal como lo lee la solicitud, por lo que otro cambio hecho
            en el mismo instante aún puede hacerla fallar con ese 409.
          examples:
          - 3
      additionalProperties: false
      type: object
      title: ReopenPipelineRecordBody
      description: Cuerpo de la solicitud para reabrir un registro de pipeline cerrado.
    TemplateDiscoveryResponse:
      properties:
        id:
          type: string
          title: Id
          description: Identificador único de la plantilla.
          examples:
            - f0000040-0000-4000-8000-000000000040
        name:
          type: string
          title: Name
          description: Nombre de la plantilla, utilizado para identificarla al enviarla.
          examples:
            - order_shipped_promo
        language:
          type: string
          title: Language
          description: >-
            Idioma del pivot resuelto (idioma predeterminado de la plantilla),
            como código de Meta: es, en, pt_BR.
          examples:
            - es
            - pt_BR
        variables:
          items:
            $ref: "#/components/schemas/TemplateVariableResponse"
          type: array
          title: Variables
          description: Inventario agnóstico de las variables de esta plantilla.
        driftWarning:
          $ref: "#/components/schemas/TemplateDriftWarningResponse"
          title: Drift warning
          description: Diferencia entre declaración y snapshot, solo para diagnóstico.
            Nunca bloquea un envío.
      type: object
      required:
        - id
        - name
        - language
        - driftWarning
      title: TemplateDiscoveryResponse
      description: >-
        Inventario agnóstico de las variables de una plantilla para un cliente
        que debe enviarla sin conocer el modelo de Meta.
      examples:
        - id: f0000040-0000-4000-8000-000000000040
          language: es
          name: order_shipped_promo
          driftWarning:
            hasDrift: false
            stale: []
            missingLabels: []
          variables:
            - callerMustSupply: false
              key: first_name
              label: Contact first name
            - callerMustSupply: false
              key: order_code
              label: Order code
            - callerMustSupply: false
              key: shipment_id
              label: Shipment ID
            - callerMustSupply: true
              key: promo_code
              label: Promo code
    TemplateDriftWarningResponse:
      properties:
        hasDrift:
          type: boolean
          title: Has drift
        stale:
          items:
            $ref: "#/components/schemas/TemplateVariableRef"
          type: array
          title: Stale
          description: Declarado, pero ya no requerido por el snapshot.
        missingLabels:
          items:
            $ref: "#/components/schemas/TemplateVariableRef"
          type: array
          title: Missing labels
          description: Requerido por el snapshot, pero aún no declarado.
      type: object
      required:
        - hasDrift
      title: TemplateDriftWarningResponse
      description: >-
        Diferencia, solo para diagnóstico, entre las variables declaradas y lo
        que requiere el snapshot de Meta.


        Según la regla de autoridad, esto nunca afecta el éxito de un envío: lo
        determina únicamente el snapshot. Permite que el cliente o la consola
        identifique una plantilla cuyas etiquetas necesitan actualizarse tras
        una edición realizada directamente en WhatsApp Manager.
    TemplateVariableRef:
      properties:
        key:
          type: string
          title: Key
          examples:
            - delivery_date
        label:
          type: string
          title: Label
          examples:
            - Delivery date
      type: object
      required:
        - key
        - label
      title: TemplateVariableRef
      description: Slot identificado solo por su clave y etiqueta agnósticas, sin
        dirección de slot de Meta.
    TemplateVariableResponse:
      properties:
        key:
          type: string
          title: Key
          description: Identificador agnóstico de esta variable, estable entre proveedores.
          examples:
            - tracking_code
        label:
          type: string
          title: Label
          description: Etiqueta legible de esta variable.
          examples:
            - Tracking code
        callerMustSupply:
          type: boolean
          title: Caller must supply
          description: >-
            Indica si el cliente debe proporcionar un valor para esta variable
            al enviar la plantilla: true si la plantilla no tiene un origen
            declarado para ese valor (por ejemplo, un código promocional que
            solo conoce el cliente) y false si Bridge lo resuelve por su cuenta
            (por ejemplo, desde el perfil del destinatario).
          examples:
            - true
            - false
        isCustom:
          type: boolean
          title: Is custom
          description: >-
            Indica si es una variable personalizada: un valor que solo conoce el
            cliente y que tiene un texto predeterminado. El cliente puede
            enviarlo en `parameters`; si se omite o se envía vacío, se utiliza
            `default`.
          default: false
          examples:
            - true
            - false
        default:
          anyOf:
            - type: string
            - type: "null"
          title: Default
          description: "Para una variable personalizada, el texto que se envía cuando quien llama no proporciona un valor; en los demás casos, null."
          examples:
            - pending
            - null
      type: object
      required:
        - key
        - label
        - callerMustSupply
      title: TemplateVariableResponse
      description: >-
        Variable de plantilla identificada por su clave agnóstica; aquí nunca
        aparece una dirección de slot de Meta.
      examples:
        - callerMustSupply: false
          isCustom: false
          key: first_name
          label: Contact first name
        - callerMustSupply: false
          default: pending
          isCustom: true
          key: tracking_code
          label: Tracking code
        - callerMustSupply: true
          isCustom: false
          key: promo_code
          label: Promo code
    UpdateContactBody:
      properties:
        firstName:
          anyOf:
            - type: string
            - type: "null"
          title: First Name
          description: Nombre del contacto.
          examples:
            - John
            - null
        lastName:
          anyOf:
            - type: string
            - type: "null"
          title: Last Name
          description: Apellido del contacto.
          examples:
            - Doe
            - null
        email:
          anyOf:
            - type: string
              format: email
            - type: "null"
          title: Email
          description: Correo electrónico del contacto.
          examples:
            - john.doe@example.com
            - null
        languageCode:
          anyOf:
            - $ref: "#/components/schemas/LanguageCode"
            - type: "null"
          title: Language Code
          description: Código de idioma del contacto.
          examples:
            - EN
        cellphone:
          anyOf:
            - type: string
            - type: "null"
          title: Cellphone
          description: >-
            Número de celular del contacto. Si no incluye código de país, se
            interpreta según el país del workspace.
          examples:
            - "+14084029292"
            - null
        ownerIdentifier:
          anyOf:
            - $ref: "#/components/schemas/InternalUserIdentifierRequest"
            - type: "null"
          title: Owner Identifier
          description: Identificador del vendedor o usuario propietario del contacto.
        customAttributes:
          $ref: "#/components/schemas/CustomAttributesBody"
          title: Custom Attributes
          description: Objeto con las listas openAttributes y closedAttributes.
      additionalProperties: false
      type: object
      title: UpdateContactBody
      description: Cuerpo de la solicitud para actualizar un contacto existente.
    UpdateConversation:
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
          description: Nombre o título opcional de la conversación.
          examples:
            - Client Support
            - null
        status:
          anyOf:
            - $ref: "#/components/schemas/ConversationStatus"
            - type: "null"
          title: Status
          description: >-
            Estado inicial de la conversación: 'active' para conversaciones
            visibles y 'ghost' para conversaciones invisibles hasta la primera
            interacción.
          examples:
            - ACTIVE
        participants:
          anyOf:
            - $ref: "#/components/schemas/ParticipantOperationsRequest"
            - type: "null"
          title: Participants
          description: Operaciones para agregar y eliminar participantes de una
            conversación.
      additionalProperties: false
      type: object
      title: UpdateConversation
      description: Cuerpo de la solicitud para actualizar una conversación existente.
    UpdatePipelineRecordBody:
      properties:
        expectedRevision:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Revision
          description: La `revision` del registro que leíste por última vez. Cuando
            ya no es la actual, el cambio falla con 409 `BRIDGE_PIPELINE_0101` y el
            registro actual en `extra.currentRecord`. Sin ella, el cambio se aplica
            al registro tal como lo lee la solicitud, por lo que otro cambio hecho
            en el mismo instante aún puede hacerla fallar con ese 409.
          examples:
          - 3
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: 'Nuevo nombre del registro, de hasta 200 caracteres. Omítelo
            para conservar el actual. Un registro siempre tiene nombre: `null` o un
            texto vacío falla con 422 `BRIDGE_PIPELINE_0311` (`errRecordName`).'
          examples:
          - Acme renewal 2027 - expanded
        values:
          additionalProperties: true
          type: object
          title: Values
          description: Valores a cambiar, indexados por id de atributo; los atributos
            omitidos conservan su valor. Un `null`, un texto vacío o una lista vacía
            elimina el valor. Solo se aceptan atributos de alcance `RECORD` de la
            versión que sigue el registro, cada uno validado según su tipo.
          examples:
          - budget: 18000000
      additionalProperties: false
      type: object
      title: UpdatePipelineRecordBody
      description: Cuerpo de la solicitud para cambiar el nombre o algunos valores
        de un registro de pipeline.
    UserStatusFilter:
      type: string
      enum:
        - active
        - disabled
        - all
      title: UserStatusFilter
    UserType:
      type: string
      enum:
        - INTERNAL
        - EXTERNAL
        - BOT
      title: UserType
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
  securitySchemes:
    x-api-key:
      type: apiKey
      description: Copy the API key as provided by the Bridge Console.
      in: header
      name: x-api-key
