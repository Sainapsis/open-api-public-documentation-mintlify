  /bridge/api/v1/workspaces/{workspaceId}/records:
    post:
      tags:
      - Pipeline Records API
      summary: Crear un registro de pipeline
      description: 'Crea un registro de un contacto en un pipeline, como una oportunidad
        de venta.


        El contacto se indica con exactamente uno de `id`, `phone` o `email` y debe
        existir: nunca se crea (404

        `BRIDGE_EXTERNAL_0001`). `pipelineId` toma por defecto el pipeline predeterminado
        del workspace y `stageId` la

        etapa inicial del pipeline. Un `name` ausente o vacío toma por defecto el
        nombre completo del contacto, luego su

        celular y luego su correo electrónico. Solo se aceptan etapas abiertas, y
        solo atributos de alcance `RECORD` de la

        versión actual del pipeline en `values` (un `null`, un texto vacío o una lista
        vacía se omite); cada problema

        encontrado se lista en `extra.errors` del 422

        `BRIDGE_PIPELINE_0311`. Cuando la etapa en la que empieza el registro exige
        un contacto completo (nombre, apellido,

        celular y cada atributo personalizado obligatorio del workspace), uno incompleto
        falla con 422

        `BRIDGE_PIPELINE_0305`, cuyo `extra.missing` indica lo que le falta. Un segundo
        registro con el mismo `externalId`

        en el pipeline falla con 409 `BRIDGE_PIPELINE_0003`, cuyo `extra.recordId`
        es el registro existente.


        `Idempotency-Key` es obligatorio. Reintentar con la misma clave y el mismo
        cuerpo responde 201 con el primer registro y

        `Idempotent-Replayed: true`. La misma clave con un cuerpo distinto falla con
        422 `BRIDGE_PIPELINE_0402`, y

        mientras la primera solicitud sigue en curso, con 409 `BRIDGE_PIPELINE_0401`.
        Cuando la solicitud falla, la clave se

        libera y puede reintentarse. Si la primera solicitud se cortó antes de terminar,
        su clave sigue respondiendo 409

        `BRIDGE_PIPELINE_0401` hasta por 24 horas: reintenta con una clave nueva y
        envía `externalId` para que un reintento nunca

        cree un segundo registro.'
      operationId: create_pipeline_record_bridge_api_v1_workspaces__workspaceId__records_post
      security:
      - x-api-key: []
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Identificador único del workspace (UUID v4).
          examples:
          - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
          title: Workspaceid
        description: Identificador único del workspace (UUID v4).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Una clave que eliges por cada registro a crear, como el id
            de operación de tu sistema. Envía la misma clave cuando reintentes la
            solicitud: durante 24 horas responde con el registro que creó la primera
            solicitud.'
          examples:
          - erp-opp-981-create
          title: Idempotency-Key
        description: 'Una clave que eliges por cada registro a crear, como el id de
          operación de tu sistema. Envía la misma clave cuando reintentes la solicitud:
          durante 24 horas responde con el registro que creó la primera solicitud.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePipelineRecordBody'
              description: Cuerpo de la solicitud para crear un registro de pipeline.
      responses:
        '201':
          description: El registro se creó, o lo creó una solicitud anterior con la
            misma clave.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRecordResponse'
          headers:
            Location:
              description: URL del registro.
              schema:
                type: string
            Idempotent-Replayed:
              description: '`true` cuando el registro proviene de una solicitud anterior
                con la misma clave.'
              schema:
                type: string
                enum:
                - 'true'
        '429':
          description: Demasiadas solicitudes
          content:
            application/json:
              examples:
                WORKSPACE_BUDGET_EXHAUSTED:
                  value:
                    title: Too Many Requests
                    status: 429
                    code: BRIDGE_RATE_LIMIT_0001
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Contenido no procesable
          content:
            application/json:
              examples:
                INVALID_FIELD_FORMAT:
                  value:
                    title: Invalid Field Format
                    status: 422
                    code: BRIDGE_CORE_0101
                PIPELINE_RECORD_VALIDATION_FAILED:
                  value:
                    title: Pipeline Record Validation Failed
                    status: 422
                    code: BRIDGE_PIPELINE_0311
                CONTACT_INCOMPLETE:
                  value:
                    title: Contact Incomplete
                    status: 422
                    code: BRIDGE_PIPELINE_0305
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    title: Idempotency Key Reused
                    status: 422
                    code: BRIDGE_PIPELINE_0402
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Acceso prohibido
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    title: Forbidden
                    status: 403
                    code: BRIDGE_CORE_0301
                PIPELINES_DISABLED:
                  value:
                    title: Pipelines Disabled
                    status: 403
                    code: BRIDGE_PIPELINE_0301
                PIPELINE_ENTRY_DISABLED:
                  value:
                    title: Pipeline Entry Disabled
                    status: 403
                    code: BRIDGE_PIPELINE_0317
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No encontrado
          content:
            application/json:
              examples:
                WORKSPACE_NOT_FOUND:
                  value:
                    title: Workspace Not Found
                    status: 404
                    code: BRIDGE_WORKSPACE_0001
                EXTERNAL_USER_NOT_FOUND:
                  value:
                    title: External User Not Found
                    status: 404
                    code: BRIDGE_EXTERNAL_0001
                PIPELINE_NOT_FOUND:
                  value:
