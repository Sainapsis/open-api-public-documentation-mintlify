components:
  schemas:
    AgentConfigStatus:
      type: string
      enum:
        - DRAFT
        - COMPLETE
      title: AgentConfigStatus
    AgentLine:
      properties:
        providerChannelId:
          type: string
          title: Provider Channel Identifier
          description: >-
            Identificador de la línea (el mismo valor que recibe
            `providerChannelId` en las operaciones salientes).
      type: object
      required:
        - providerChannelId
      title: AgentLine
      description: Línea de WhatsApp en la que responde un Agent.
    AgentOutboundContactRef:
      properties:
        identifier:
          type: string
          title: Identifier
          description: >-
            Identificador del Contact según identifierType: ID de Contact para
            ID, correo electrónico para EMAIL o teléfono en formato E.164 para
            PHONE. El Contact ya debe existir en el workspace.
          examples:
            - "+573001234567"
        identifierType:
          $ref: "#/components/schemas/ParticipantIdentifierType"
          title: Identifier Type
          description: Tipo de identificador.
          examples:
            - PHONE
            - EMAIL
            - ID
        messageProviderType:
          $ref: "#/components/schemas/MessageProviderType"
          title: Message Provider Type
          description: Proveedor utilizado para entregar la plantilla.
          examples:
            - WHATSAPP
        providerChannelId:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Channel Identifier
          description: >-
            Opcional. Línea preferida del Agent (el `providerChannelId` de una
            de sus `lines` en `GET /agents`). Si se omite, se puede usar
            cualquiera de sus líneas. Si se proporciona, debe ser una línea
            activa del Agent; de lo contrario, la solicitud falla con 422. Es
            una preferencia, no una garantía: si esa línea no está libre ni es
            recuperable, se aplica el mismo orden a todas las líneas del Agent
            (con `forceSend=true`, primero una ocupada que controle este Agent y
            luego la indicada). La respuesta no identifica la línea utilizada.
          examples:
            - c4f2a1e0-9b8d-4e7c-a6f5-1d2e3f4a5b6c
            - null
      type: object
      required:
        - identifier
        - identifierType
        - messageProviderType
      title: AgentOutboundContactRef
      description: Identifica el Contact al que se dirigirá la conversación saliente.
    AgentOutboundContext:
      properties:
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
          title: Notes
          description: Notas de texto libre para el Agent, limitadas a 2000 caracteres.
          examples:
            - The Contact asked about pricing tiers last week.
            - null
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: >-
            Identificadores opcionales de archivos precargados guardados en la
            conversación como contexto para el Agent.
          examples:
            - []
            - - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
      type: object
      title: AgentOutboundContext
      description: Notas y medios guardados en la conversación como contexto para el
        Agent y los Bridge Users.
    AgentOutboundFollowUp:
      properties:
        messageBody:
          type: string
          title: Message Body
          description: Cuerpo de texto plano del mensaje de seguimiento.
          examples:
            - Just confirming we're still on for tomorrow at 10am.
        mediaIds:
          items:
            type: string
          type: array
          title: Media Identifiers
          description: >-
            Se acepta, pero aún no se utiliza: los seguimientos se guardan solo
            como texto y no se envían adjuntos.
          examples:
            - []
            - - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
      type: object
      required:
        - messageBody
      title: AgentOutboundFollowUp
      description: Seguimiento de texto guardado en la conversación inmediatamente
        después de la plantilla inicial.
    AgentOutboundHandoffOverride:
      properties:
        preAssignedUser:
          $ref: "#/components/schemas/AgentOutboundPreAssignedUser"
          title: Pre-assigned User
          description: >-
            Bridge User que se asignará como asesor cuando el Agent transfiera
            la conversación. Se valida durante la solicitud: esta se rechaza si
            el usuario no existe, pertenece a otro workspace o se eliminó.
          examples:
            - identifier: advisor@acme.com
              identifierType: EMAIL
      additionalProperties: false
      type: object
      required:
        - preAssignedUser
      title: AgentOutboundHandoffOverride
      description: Preasigna el Bridge User que recibe la transferencia de la
        conversación saliente.
    AgentOutboundPreAssignedUser:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Valor que identifica al Bridge User, interpretado según
            identifierType.
          examples:
            - advisor@acme.com
            - usr_01HZ2K3J4M5N6P7Q8R9S0T1UV2
        identifierType:
          $ref: "#/components/schemas/InternalParticipantIdentifierType"
          title: Identifier Type
          description: >-
            Cómo resolver el identificador. ID busca por ID de Bridge User;
            EMAIL busca por correo electrónico.
          examples:
            - EMAIL
            - ID
      additionalProperties: false
      type: object
      required:
        - identifier
        - identifierType
      title: AgentOutboundPreAssignedUser
      description: Identifica al Bridge User que debe recibir la transferencia.
    AgentOutboundRequest:
      properties:
        contact:
          $ref: "#/components/schemas/AgentOutboundContactRef"
          title: Contact
          description: Contact al que se dirige esta conversación saliente. Ya debe
            existir en el workspace.
        template:
          $ref: "#/components/schemas/LeadscoutOutboundTemplateRef"
          title: Template
          description: Plantilla inicial que se enviará.
        additionalMessages:
          items:
            $ref: "#/components/schemas/AgentOutboundFollowUp"
          type: array
          maxItems: 5
          title: Additional Messages
          description: >-
            Hasta cinco seguimientos de texto guardados en la conversación
            después de la plantilla inicial, en el orden indicado, y enviados
            como la plantilla. Los adjuntos (`mediaIds`) aún no se envían.
        agentContext:
          anyOf:
            - $ref: "#/components/schemas/AgentOutboundContext"
            - type: "null"
          title: Agent Context
          description: Notas y medios opcionales guardados en la conversación como
            contexto para el Agent.
        consent:
          anyOf:
            - $ref: "#/components/schemas/OutboundConsentRequest"
            - type: "null"
          title: Consent
          description: >-
            Evidencia opcional de consentimiento, declarada por la empresa, que
            se registra en la conversación.
        handoffOverride:
          anyOf:
            - $ref: "#/components/schemas/AgentOutboundHandoffOverride"
            - type: "null"
          title: Handoff Override
          description: >-
            Opcional. Preasigna un Bridge User específico como asesor para la
            transferencia. El Bridge User se valida antes de cualquier
            escritura: se rechaza la solicitud si el usuario no existe,
            pertenece a otro workspace o se eliminó.
        brandId:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Identifier
          description: >-
            ID opcional de marca. Si se indica, solo son elegibles las líneas
            del Agent vinculadas a esa marca; si no hay ninguna, la solicitud
            falla con 404. Omítelo para considerar todas las líneas del Agent.
          examples:
            - null
            - 7e1d2c3b-4a5f-6e7d-8c9b-0a1b2c3d4e5f
        campaignId:
          anyOf:
            - type: string
            - type: "null"
          title: Campaign Identifier
          description: Referencia opcional de campaña guardada en la conversación para
            auditoría e informes.
          examples:
            - null
            - spring_promo_2026
        forceSend:
          type: boolean
          title: Force Send
          description: >-
            Controla qué ocurre cuando ninguna línea del Agent está libre o es
            recuperable. Siempre tiene prioridad una línea libre, seguida de una
            línea con una conversación liberada recuperable con este Contact,
            sea cual sea el valor de esta opción. Cuando ninguna existe: con
            false (predeterminado), la solicitud falla con 409
            `BRIDGE_AI_LEADSCOUT_0008`; con true, se reutiliza una línea ocupada
            por una conversación activa con este Contact, dando preferencia a
            una que controle este Agent. Si la conversación elegida está
            controlada por otro Agent o por un Bridge User, la solicitud falla
            con 409 `BRIDGE_AI_AGENT_OUTBOUND_0006` y no se escribe nada;
            libérala primero y reintenta después. Nunca se usan líneas cuya
            conversación esté bloqueada o se haya liberado sin recuperación; por
            tanto, si ninguna línea está ocupada por una conversación activa, la
            solicitud falla con 409 `BRIDGE_AI_LEADSCOUT_0008` incluso con true.
          default: false
          examples:
            - false
            - true
      type: object
      required:
        - contact
        - template
      title: AgentOutboundRequest
      description: Cuerpo de la solicitud para iniciar una conversación saliente
        atendida por un Agent específico.
    AgentOutboundResponse:
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationResponse"
          title: Conversation
          description: >-
            Conversación que ahora controla el Agent: nueva, reutilizada
            (`alreadyInitiated`) o recuperada (`recovered`).
        contact:
          $ref: "#/components/schemas/ContactResponse"
          title: Contact
          description: Contacto con el que se inició la conversación.
        templateSent:
          anyOf:
            - $ref: "#/components/schemas/AgentTemplateSent"
            - type: "null"
          title: Template Sent
          description: Resumen de la plantilla guardada para abrir la conversación.
        additionalMessagesPersisted:
          type: integer
          title: Additional Messages Persisted
          description: Número de mensajes de seguimiento guardados en la conversación.
          default: 0
          examples:
            - 0
            - 3
        alreadyInitiated:
          type: boolean
          title: Already Initiated
          description: >-
            True cuando esta solicitud satisfactoria reutilizó una conversación
            activa existente mediante forceSend=true. False para creación o
            recuperación; consulta recovered para distinguir esas rutas. Es
            informativo: una reutilización satisfactoria también guarda la nueva
            plantilla y los seguimientos, por lo que repetir la solicitud puede
            agregar mensajes.
          default: false
          examples:
            - false
            - true
        recovered:
          type: boolean
          title: Recovered
          description: >-
            True cuando se recuperó una conversación liberada que el Contact
            tenía en la línea, en lugar de crear otra. La recuperación reemplaza
            el contexto saliente anterior y `agentContext`. Las líneas
            recuperables se usan incluso con `forceSend=false`.
          default: false
          examples:
            - false
            - true
      type: object
      required:
        - conversation
        - contact
      title: AgentOutboundResponse
      description: Cuerpo de respuesta de un inicio saliente de Agent satisfactorio.
    AgentResponse:
      properties:
        id:
          type: string
          title: Agent Identifier
          description: Identificador único del Agent.
        name:
          type: string
          title: Name
          description: Nombre del Agent.
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: Descripción del Agent. Siempre está presente; es null cuando no
            tiene descripción.
        type:
          $ref: "#/components/schemas/AgentType"
          title: Type
          description: Tipo de Agent.
          examples:
            - LEADSCOUT
            - SERVICE_AGENT
        brandId:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Identifier
          description: Marca a la que pertenece el Agent. Siempre está presente; es null
            cuando no se limita a una marca.
        status:
          $ref: "#/components/schemas/AgentConfigStatus"
          title: Status
          description: Estado de configuración del Agent.
          examples:
            - DRAFT
            - COMPLETE
        available:
          type: boolean
          title: Available
          description: "Indica si el Agent puede iniciar conversaciones: su configuración
            está completa y tiene una línea."
        unavailableReason:
          anyOf:
            - type: string
            - type: "null"
          title: Unavailable Reason
          description: >-
            Motivo por el que el Agent no está disponible: `DRAFT`
            (configuración incompleta) o `NO_LINES` (sin línea activa). Siempre
            está presente; es null cuando está disponible.
          examples:
            - DRAFT
            - NO_LINES
        lines:
          items:
            $ref: "#/components/schemas/AgentLine"
          type: array
          title: Lines
          description: Líneas activas de WhatsApp en las que responde el Agent. Vacío
            cuando no tiene ninguna.
      type: object
      required:
        - id
        - name
        - type
