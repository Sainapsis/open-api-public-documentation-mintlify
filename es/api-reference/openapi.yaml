          anyOf:
            - type: string
            - type: "null"
          title: Provider Channel Identifier
          description: ID del canal del proveedor que usará Bridge para comunicarse con el
            usuario.
        brandId:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Identifier
          description: >-
            Marca propietaria de la línea corporativa utilizada para contactar
            al usuario. Cuando el workspace tiene al menos una línea con marca,
            la selección automática de líneas se limita a esta marca y la
            solicitud debe incluir brandId o providerChannelId; se rechaza si no
            incluye ninguno. Se ignora cuando el workspace no tiene líneas con
            marca.
      type: object
      required:
        - identifier
        - identifierType
      title: ExternalUserIdentifierRequest
      description: Cuerpo para identificar a un usuario externo en Bridge.
    ExternalUserType:
      type: string
      enum:
        - PARTIAL
        - NORMAL
      title: ExternalUserType
    FileType:
      type: string
      enum:
        - IMAGE
        - VIDEO
        - AUDIO
        - DOCUMENT
        - STICKER
        - GIF
        - WEBSITE
      title: FileType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HandoffAssignee:
      properties:
        identifier:
          type: string
          title: Identifier
          description: ID o correo electrónico del usuario interno, según identifierType.
          examples:
            - u-123
            - ana@acme.com
        identifierType:
          $ref: "#/components/schemas/InternalParticipantIdentifierType"
          title: Identifier Type
          description: Estrategia de búsqueda del usuario interno. Solo se admiten ID y
            EMAIL.
          examples:
            - ID
            - EMAIL
      additionalProperties: false
      type: object
      required:
        - identifier
        - identifierType
      title: HandoffAssignee
      description: Usuario interno al que se asignará la conversación durante una
        transferencia.
    HandoffRequest:
      properties:
        assignees:
          items:
            $ref: "#/components/schemas/HandoffAssignee"
          type: array
          minItems: 1
          title: Assignees
          description: Usuarios internos que recibirán la transferencia de la
            conversación. Se requiere al menos uno.
        handoffMessages:
          items:
            type: string
          type: array
          title: Handoff Messages
          description: Cuerpos de mensajes opcionales publicados como parte de la
            transferencia.
        includeAiLeadSummary:
          type: boolean
          title: Include AI Lead Summary
          description: Con true, el mensaje de transferencia debe incluir un resumen del
            lead generado por IA.
          default: false
      additionalProperties: false
      type: object
      required:
        - assignees
      title: HandoffRequest
      description: Cuerpo de la solicitud de transferencia manual de LeadScout.
    HandoffResponse:
      properties:
        trackingId:
          type: string
          title: Tracking Identifier
          description: ID de correlación generado para esta solicitud de transferencia.
        conversationId:
          type: string
          title: Conversation Identifier
          description: Conversación a la que se dirige la transferencia.
        status:
          type: string
          title: Status
          description: Estado de aceptación de la solicitud de transferencia.
          examples:
            - ACCEPTED
        assignees:
          items:
            $ref: "#/components/schemas/HandoffAssignee"
          type: array
          title: Assignees
          description: Repite los destinatarios recibidos en la solicitud.
      type: object
      required:
        - trackingId
        - conversationId
        - status
        - assignees
      title: HandoffResponse
      description: Cuerpo de respuesta que confirma la aceptación de la solicitud de
        transferencia.
    HeaderFileType:
      type: string
      enum:
        - IMAGE
        - VIDEO
        - GIF
      title: HeaderFileType
    InternalOperationRequest:
      properties:
        add:
          items:
            $ref: "#/components/schemas/InternalUserIdentifierRequest"
          type: array
          title: Add
          description: Participantes internos que se agregarán.
        remove:
          items:
            $ref: "#/components/schemas/InternalUserIdentifierRequest"
          type: array
          title: Remove
          description: Participantes internos que se eliminarán
      type: object
      title: InternalOperationRequest
      description: Operaciones sobre participantes internos de una conversación.
    InternalParticipant:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Valor del identificador del participante.
          examples:
            - ef7ee722-5f95-415a-9a98-81eeae178b11
        identifierType:
          $ref: "#/components/schemas/InternalParticipantIdentifierType"
          title: Identifier Type
          description: Tipo de identificador de participantes internos (ID o EMAIL).
          examples:
            - EMAIL
            - ID
        role:
          $ref: "#/components/schemas/UserType"
          title: Role
          description: Rol del participante en la conversación.
          examples:
            - EXTERNAL
            - INTERNAL
        joinedAt:
          type: string
          format: date-time
          title: Joined At
          description: Fecha y hora en que el participante se unió a la conversación.
          examples:
            - "2004-04-10T09:00:00.000Z"
        lastSeenAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Last Seen At
          description: Fecha y hora de la última actividad observada del participante.
          examples:
            - null
            - "2004-04-10T09:00:00.000Z"
      type: object
      required:
        - identifier
        - identifierType
        - role
        - joinedAt
      title: Participant
      description: Objeto que representa al participante interno de la conversación.
    InternalParticipantIdentifierType:
      type: string
      enum:
        - ID
        - EMAIL
      title: InternalParticipantIdentifierType
    InternalUserIdentifierRequest:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Valor del identificador del usuario.
          examples:
            - john.doe@example.com
            - "+13802098869"
            - 37673840-6259-40f9-bbe5-a7db40f8e3cf
        identifierType:
          $ref: "#/components/schemas/InternalParticipantIdentifierType"
          title: Identifier Type
          description: Tipo de identificador de usuarios internos (ID o EMAIL).
          examples:
            - EMAIL
            - ID
      type: object
      required:
        - identifier
        - identifierType
      title: InternalUserIdentifierRequest
      description: Cuerpo para identificar a un usuario interno en Bridge.
    InternalUserResponse:
      properties:
        id:
          type: string
          title: Identifier
          description: Identificador único del usuario interno (UUID v4).
          examples:
            - b6cf1c4a-2b1e-4e63-8f3e-0f9d1a2a1234
        firstName:
          anyOf:
            - type: string
            - type: "null"
          title: First Name
          description: Nombre del usuario interno.
          examples:
            - John
            - null
        lastName:
          anyOf:
            - type: string
            - type: "null"
          title: Last Name
          description: Apellido del usuario interno.
          examples:
            - Doe
            - null
        email:
          anyOf:
            - type: string
            - type: "null"
          title: Email
          description: Correo electrónico del usuario interno.
          examples:
            - john.doe@example.com
            - null
        cellphone:
          anyOf:
            - type: string
            - type: "null"
          title: Cellphone
          description: Número de celular del usuario interno.
          examples:
            - "+14084029292"
            - null
        languageCode:
          anyOf:
            - $ref: "#/components/schemas/LanguageCode"
            - type: "null"
          title: Language Code
          description: Código de idioma del usuario interno.
          examples:
            - EN
            - null
        status:
          type: string
          enum:
            - active
            - disabled
          title: Status
          description: "'active' cuando el usuario interno está activo; 'disabled' cuando
            se eliminó al usuario."
          examples:
            - active
            - disabled
        createdAt:
          type: string
          title: Created At
          description: Fecha y hora de creación del usuario interno.
          examples:
            - "2003-04-10T08:00:00.000Z"
        updatedAt:
          type: string
          title: Updated At
          description: Fecha y hora de la última actualización del usuario interno.
          examples:
            - "2003-04-10T08:00:00.000Z"
      type: object
      required:
        - id
        - status
        - createdAt
        - updatedAt
      title: InternalUserResponse
      description: Cuerpo de respuesta para operaciones de lectura de usuarios
        internos (agentes humanos).
    InternalUsersResponseList:
